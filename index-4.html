// ---------- CONTROLS ----------
function moveLeft()  { if (!game.over && !game.paused) game.lane = Math.max(0, game.lane - 1); }
function moveRight() { if (!game.over && !game.paused) game.lane = Math.min(2, game.lane + 1); }
// PARKED CARS (variants 1 and 2) can be jumped over. Taxis, police cars, delivery vans, buses
// and the incoming paparazzi vans cannot: change lanes for those.
const PARKED_CAR = { 1: true, 2: true };
function parkedClear(variant) {                       // how high your feet must be to clear it (a bit under the roof = fair margin)
  const m = SPR.obBlock[variant];
  return 0.8 * (90 * m.img.height / m.img.width);
}
function jump() {
  if (game.over || game.paused) return;
  if (game.jumpY === 0 && game.slideTime <= 0) { game.vy = 620; sfx('jump'); }
}
function slide() {
  if (game.over || game.paused) return;
  if (game.jumpY > 0) game.vy = -900;   // slam down fast if in the air
  game.slideTime = 0.6;
  sfx('slide');
}

// What a "press" does after the run ends:
//  - CAUGHT: retry after half a second
//  - HE GOT AWAY: first press skips the party, the next one starts a new chase
function pressAction() {
  if (!game.over) return;
  const et = game.endTimer;
  if (game.result === 'caught') {
    if (et > 0.5) goTo(beginRun);
    return;
  }
  if (et < T_FINAL) {
    if (et > 0.6) game.endTimer = T_FINAL + 0.2;
  } else if (et > T_FINAL + 0.5) {
    goTo(beginRun);
  }
}

document.addEventListener('keydown', function (e) {
  audioUnlock();
  const k = e.key.toLowerCase();
  if (trans) { e.preventDefault(); return; }       // a screen change is happening
  if (screen !== 'play') {                        // home screen and menu pages
    menuKey(k);
    if ([' ', 'enter', 'escape', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
    return;
  }
  if (game.over && (k === 'escape' || k === 'm') && endRetryReady()) {   // back to the home screen
    goTo(goHome);
    e.preventDefault();
    return;
  }
  if (game.over) {
    if (k === ' ' || k === 'enter') {
      pressAction();
      e.preventDefault();
    }
    return;
  }
  if (k === 'escape' || k === 'p') {                 // pause / resume
    setPaused(!game.paused);
    e.preventDefault();
    return;
  }
  if (game.paused) {
    if (k === 'enter' || k === ' ') game.paused = false;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    return;
  }
  if (k === 'arrowleft' || k === 'a') moveLeft();
  if (k === 'arrowright' || k === 'd') moveRight();
  if (k === ' ' || k === 'arrowup' || k === 'w') jump();
  if (k === 'arrowdown' || k === 's') slide();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});

// Phone swipes: a swipe changes lane / jumps / slides the moment your finger has moved far enough.
// Swipes only steer the detective during a live chase; menus, shop, pause and results ignore them.
const SWIPE_MIN = 24;                       // how far (in screen pixels) your finger must move
let touchX = 0, touchY = 0, swiped = false;
// the whole screen listens for swipes (not just the picture), and a cancelled touch can never leave the controls stuck
document.addEventListener('touchcancel', function () { swiped = false; });
function chaseLive() { return screen === 'play' && !game.over && !game.paused && !trans; }
function doSwipe(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) { if (dx > 0) moveRight(); else moveLeft(); }
  else if (dy < 0) jump(); else slide();
}
document.addEventListener('touchstart', function (e) {
  if (e.target !== canvas && e.target !== document.body && e.target !== document.documentElement) return;   // (the error screen keeps its own tap)
  audioUnlock();
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
  swiped = false;
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', function (e) {
  if (e.target !== canvas && e.target !== document.body && e.target !== document.documentElement) return;   // (the error screen keeps its own tap)
  e.preventDefault();
  if (!chaseLive() || !e.touches.length) return;
  const dx = e.touches[0].clientX - touchX;
  const dy = e.touches[0].clientY - touchY;
  if (!swiped && Math.max(Math.abs(dx), Math.abs(dy)) >= SWIPE_MIN) {      // one move per swipe, however long the swipe is
    doSwipe(dx, dy);
    swiped = true;
  }
}, { passive: false });
document.addEventListener('touchend', function (e) {
  if (e.target !== canvas && e.target !== document.body && e.target !== document.documentElement) return;   // (the error screen keeps its own tap)
  audioUnlock();
  if (trans) { e.preventDefault(); return; }
  const wasSwipe = swiped; swiped = false;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  const tp = canvasPos(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  const isTap = !wasSwipe && Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN;
  if (screen !== 'play') {
    if (isTap) menuTap(tp);
    e.preventDefault();
    return;
  }
  if (isTap && hit(SND_BTN, tp)) { toggleMaster(); e.preventDefault(); return; }
  if (game.over) {
    if (isTap) {
      if (endRetryReady() && inMainBtn(tp)) goMain(); else if (endRetryReady() && inMenuBtn(tp)) goTo(goHome); else pressAction();
    }
    e.preventDefault();
    return;
  }
  if (wasSwipe) { e.preventDefault(); return; }
  if (isTap) {                                           // a tap: pause button or pause menu
    if (game.paused) { const id = pauseItemAt(tp); if (id) pauseAction(id); }
    else if (hit(PAUSE_BTN, tp)) setPaused(true);
    e.preventDefault();
    return;
  }
  if (!game.paused) doSwipe(dx, dy);                     // fallback for phones that skip touchmove
  e.preventDefault();
}, { passive: false });
// clicking with a mouse also works on the end screens
canvas.addEventListener('mousedown', function (e) {
  audioUnlock();
  if (trans) return;
  const pos = canvasPos(e.clientX, e.clientY);
  if (screen !== 'play') { menuTap(pos); return; }
  if (hit(SND_BTN, pos)) { toggleMaster(); return; }
  if (game.over) {
    if (endRetryReady() && inMainBtn(pos)) goMain(); else if (endRetryReady() && inMenuBtn(pos)) goTo(goHome); else pressAction();
  } else if (game.paused) {
    const id = pauseItemAt(pos); if (id) pauseAction(id);
  } else if (hit(PAUSE_BTN, pos)) {
    setPaused(true);
  }
});
canvas.addEventListener('mousemove', function (e) {
  const pos = canvasPos(e.clientX, e.clientY);
  if (screen === 'play') {
    menuHover = game.paused ? pauseItemAt(pos) : null;
    if (game.over && endRetryReady()) menuHover = inMainBtn(pos) ? 'main' : (inMenuBtn(pos) ? 'menu' : (hit(AGAIN_BTN, pos) ? 'again' : null));
    canvas.style.cursor = (menuHover || hit(SND_BTN, pos) || (!game.over && hit(PAUSE_BTN, pos))) ? 'pointer' : 'default';
    return;
  }
  menuHover = menuButtonAt(pos);
  canvas.style.cursor = menuHover ? 'pointer' : 'default';
});

// ---------- HELPERS ----------
// s is "how close" something is: 0 = far away, 1 = right at the detective
function laneX(lane, s) { return W / 2 + (lane - 1) * 130 * s; }
function groundY(s)     { return HORIZON + (BOTTOM - HORIZON) * s; }

// how wide the road and the sidewalk are at distance s (half-widths)
function roadHalf(s) { return 18 + 197 * s; }
function sideHalf(s) { return roadHalf(s) + 55 * s; }

// how many meters are left until the mansion
function metersLeft() { return Math.max(0, LEVEL_LENGTH - Math.floor(game.distance)); }

// turns seconds into a clock like 01:42.83
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0');
}

// the current combo number (x1, x2, x3 ...)
function comboMult() {
  return Math.min(MAX_COMBO, 1 + Math.floor(game.streak / STREAK_PER_LEVEL));
}

// ---------- COLLECTING, COMBOS, CRASHING, ENDING, PARTICLES ----------
function collect(it) {
  it.done = true;
  game.streak++;
  const mult = comboMult();
  const pts = ITEM_POINTS[it.type] * mult * (game.boostT > 0 ? 2 : 1);
  game.score += pts;
  game.evidence++;
  game.bestCombo = Math.max(game.bestCombo, mult);
  game.comboPop = 1;
  sfx('item');

  const px = laneX(game.displayLane, 1);
  const py = BOTTOM - 100;
  sparkle(px, py, ITEM_COLORS[it.type], 12);
  game.floats.push({ x: px, y: py - 20, text: '+' + pts, color: ITEM_COLORS[it.type], life: 0.9, size: 22 });
  comboEvents();
}

// small celebrations when the combo climbs
function comboEvents() {
  const m = comboMult();
  if (m > game.lastMult) {
    sfx('combo', m);
    if (m === 4) sparkle(W / 2, 182, '#ff4fd8', 14);
    if (m === MAX_COMBO) { game.maxT = 1.6; sparkle(W / 2, 182, '#ffd400', 22); }
  }
  game.lastMult = m;
}

// last-moment dodge of a van or a big obstacle
function perfectDodge() {
  game.perfects++;
  sfx('perfect');
  game.streak++;
  const pts = 100 * (game.boostT > 0 ? 2 : 1);
  game.score += pts;
  game.bestCombo = Math.max(game.bestCombo, comboMult());
  game.comboPop = 1;
  game.floats.push({ x: W / 2, y: 330, text: 'PERFECT DODGE!', color: '#4dffe0', life: 1.0, size: 24 });
  game.floats.push({ x: W / 2, y: 356, text: '+' + pts, color: '#ffd400', life: 0.9, size: 18 });
  comboEvents();
}

// the shield pops: pixel shards fly out
function shieldBreak() {
  sfx('shield');
  game.shield = false;
  game.invincible = 0.9;
  game.camFlash = 0.12;
  const px = laneX(game.displayLane, 1), py = BOTTOM - 60;
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    game.particles.push({ x: px, y: py, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220 - 80,
                          life: 0.6, color: i % 2 ? '#bfe0ff' : '#4da6ff' });
  }
  game.floats.push({ x: px, y: py - 70, text: 'SHIELD BROKE!', color: '#7fc8ff', life: 0.9, size: 20 });
}
function breakCombo() {
  if (game.streak >= STREAK_PER_LEVEL) {
    game.floats.push({ x: W / 2, y: 215, text: 'COMBO LOST', color: '#ff2a4d', life: 1.0, size: 22 });
  }
  game.streak = 0;
  game.lastMult = 1;
}

function crash() {
  sfx('crash');
  game.meter = Math.max(0, game.meter - CRASH_PENALTY);  // he gets further away
  game.invincible = 1.5;
  game.stumble = 0.8;
  game.shake = 0.35;
  game.hitFlash = 0.25;
  breakCombo();
}

const CAUGHT_REWARD = 1000;       // Case Coins for a successful catch
function endRun(result) {
  if (game.over) return;           // a run can only end once (so rewards can never be paid twice)
  const prevBest = stats.bestScore, prevDist = stats.bestDistance || 0;
  game.newRecord = (prevBest > 0 && game.score > prevBest) || (prevDist > 0 && Math.floor(game.distance) > prevDist);
  stats.runs++;
  if (result === 'caught') stats.caught++; else stats.escaped++;
  stats.bestScore = Math.max(stats.bestScore, game.score);
  stats.bestDistance = Math.max(stats.bestDistance || 0, Math.floor(game.distance));
  stats.bestCombo = Math.max(stats.bestCombo, game.bestCombo);
  stats.bestEvidence = Math.max(stats.bestEvidence, game.evidence);
  stats.juice += game.juice;
  saveStats();
  game.caughtBonus = 0;
  if (result === 'caught') { game.caughtBonus = CAUGHT_REWARD; totalCoins += CAUGHT_REWARD; saveCoins(); }   // paid once, saved at once
  game.over = true;
  game.result = result;
  game.endTimer = 0;
  sfx(result === 'caught' ? 'caught' : 'escape');       // the right sound for the right ending
  progressMissions();
  if (result === 'caught') {
    game.shake = 0.8;
    game.target.looking = 99;     // he freezes, facing us, scared
    burst();
  }
}

// a small puff of sparkles at any spot
function sparkle(x, y, color, count) {
  if (game.particles.length > 260) return;     // never let effects pile up
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 160;
    game.particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 0.35 + Math.random() * 0.3,
      color: color
    });
  }
}

// confetti explosion at the target's position
function burst() {
  const t = game.target;
  const x = laneX(t.displayLane, t.s);
  const y = groundY(t.s) - 60 * t.s;
  const colors = ['#ffd400', '#ff4fd8', '#3a7bff', '#ffffff'];
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 100 + Math.random() * 350;
    game.particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.8 + Math.random() * 0.6,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateParticles(dt) {
  const ps = game.particles;
  let j = 0;
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 500 * dt;     // gravity pulls them down
    p.life -= dt;
    if (p.life > 0) ps[j++] = p;
  }
  ps.length = j;

  const fs = game.floats;
  j = 0;
  for (let i = 0; i < fs.length; i++) {
    const f = fs[i];
    f.y -= 60 * dt;
    f.life -= dt;
    if (f.life > 0) fs[j++] = f;
  }
  fs.length = j;
}

// =====================================================
// ROADSIDE SCENERY
// =====================================================
function newBuilding(side, s, zi) {
  if (ZONES[zi].id === 'water' && side < 0) return null;     // open water on the left at the waterfront
  const k = side < 0 ? 0 : 1;
  let v = Math.floor(Math.random() * VARIANTS);
  if (zi * 100 + v === game.lastVariant[k]) v = (v + 1) % VARIANTS;
  game.lastVariant[k] = zi * 100 + v;
  return { cls: 'sc', kind: 'building', side: side, s: s, zi: zi, variant: v, phase: Math.random() * 6 };
}

function newFurniture(side, s, zi) {
  let kind = pickWeighted(ZONES[zi].furn);
  const id = ZONES[zi].id;
  if ((kind === 'dock' || kind === 'boat') && side > 0) kind = 'lamp';
  if ((kind === 'crane' || kind === 'containers') && side < 0) kind = 'lamp';
  let variant = 0;
  if (kind === 'tlight') variant = Math.floor(Math.random() * 2);
  else if (kind === 'ped') variant = Math.floor(Math.random() * SPR.peds.length);
  else if (kind === 'tree') variant = Math.floor(Math.random() * 2);
  else if (kind === 'boat') variant = Math.floor(Math.random() * 3);
  else if (kind === 'car') {
    const r = Math.random();
    if (id === 'estate') variant = Math.floor(Math.random() * 7);
    else if (r < 0.5) variant = Math.floor(Math.random() * 7);
    else if (r < 0.58) variant = 7;
    else if (r < 0.76) variant = 8;
    else if (r < 0.88) variant = 9;
    else variant = 10;
  }
  return { cls: 'sc', kind: kind, side: side, s: s, variant: variant, phase: Math.random() * 6 };
}

// a person or a small group on the sidewalk
function newNpc(side, s) {
  if (Math.random() < 0.3) return { cls: 'sc', kind: 'group', side: side, s: s, variant: Math.floor(Math.random() * SPR.groups.length), phase: Math.random() * 6 };
  return { cls: 'sc', kind: 'npc', side: side, s: s, variant: Math.floor(Math.random() * SPR.npcs.length), phase: Math.random() * 6 };
}
function npcCount(side) {
  let n = 0;
  for (const p of game.scenery) if ((p.kind === 'npc' || p.kind === 'group') && p.side === side) n++;
  return n;
}

// fills the street with scenery before the run starts
function initScenery() {
  game.scenery = [];
  for (const side of [-1, 1]) {
    for (let s = 0.03; s < 1.0; s += 0.13) game.scenery.push(newBuilding(side, s + Math.random() * 0.02, 0));
    for (let s = 0.07; s < 1.0; s += 0.2)  game.scenery.push(newFurniture(side, s, 0));
    for (let s = 0.16; s < 0.95; s += 0.27) game.scenery.push(newNpc(side, s + Math.random() * 0.06));   // people from the very first metre
  }
}

function addCrossCar() {
  const dir = Math.random() < 0.5 ? -1 : 1;
  game.scenery.push({ cls: 'sc', kind: 'cross', side: 0, s: 0, s0: 0, dir: dir, u0: -dir * 1.7, u: -dir * 1.7,
                      variant: Math.floor(Math.random() * SPR.sideCars.length), phase: Math.random() * 6 });
}

// moves the scenery toward us and adds new pieces in the distance
function updateScenery(dt) {
  const roadDs = game.vs * dt * MARK_SPEED;     // things painted on the road (crosswalks, manholes) move calmly, like the lane lines
  const ds = roadDs * SIDE_SPEED;               // everything at the sides moves slower: more depth
  const list = game.scenery;
  let j = 0;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    p.s += p.flat ? roadDs : ds;
    if (p.kind === 'cross') p.u = p.u0 + p.dir * (p.s - p.s0) * 7;
    const gone = p.s > 1.08 || (p.kind === 'cross' && (p.s > 0.6 || Math.abs(p.u) > 1.9));
    if (!gone) list[j++] = p;
  }
  list.length = j;

  for (const side of [-1, 1]) {
    const k = side < 0 ? 0 : 1;
    game.nextBuilding[k] -= ds;
    if (game.nextBuilding[k] <= 0) {
      const zi = spawnZone();
      const b = newBuilding(side, 0, zi);
      if (b) list.push(b);
      game.nextBuilding[k] = ZONES[zi].gap + Math.random() * 0.03;
    }
    game.nextNpc[k] -= ds;
    if (game.nextNpc[k] <= 0) {                       // more and more people as you get closer to the mansion
      const pr = clamp(game.distance / LEVEL_LENGTH, 0, 1);
      if (npcCount(side) < 3 + Math.round(pr * 3)) list.push(newNpc(side, 0));   // 3 people per side at the start, 6 near the party
      game.nextNpc[k] = (0.34 - 0.18 * pr) + Math.random() * 0.1;
    }
    game.nextFurn[k] -= ds;
    if (game.nextFurn[k] <= 0) {
      list.push(newFurniture(side, 0, spawnZone()));
      game.nextFurn[k] = (0.18 + Math.random() * 0.06) / PAL.dens;
    }
  }

  // things painted on or crossing the road: manholes, crosswalks, cross traffic
  game.nextRoad -= roadDs;
  if (game.nextRoad <= 0) {
    game.nextRoad = 0.15 + Math.random() * 0.2;
    const id = ZONES[spawnZone()].id;
    const r = Math.random();
    if (id !== 'estate') {
      if (r < 0.4) {
        list.push({ cls: 'sc', kind: 'manhole', flat: true, side: 0, s: 0, lane: Math.floor(Math.random() * 3), variant: 0, phase: Math.random() * 6 });
      } else if (r < 0.62) {
        list.push({ cls: 'sc', kind: 'crosswalk', flat: true, side: 0, s: 0, variant: 0, phase: 0 });
      }
    }
  }

  // strings of hanging lanterns / party lights over the street
  game.nextString -= ds;
  if (game.nextString <= 0) {
    game.nextString = 0.26 + Math.random() * 0.2;
    const id = ZONES[spawnZone()].id;
    if (id === 'lantern' || id === 'estate') {      // warm lantern strings, and warm party lights on the way up to the mansion
      list.push({ cls: 'sc', kind: 'string', side: 0, s: 0, variant: 0, phase: Math.random() * 6 });
    }
  }

  // gates at the mansion
  if (!game.gateDone && metersLeft() <= 130) {
    game.gateDone = true;
    list.push({ cls: 'sc', kind: 'gate', side: -1, s: 0, variant: 0, phase: 0 });
    list.push({ cls: 'sc', kind: 'gate', side: 1, s: 0, variant: 0, phase: 0 });
  }
}

// =====================================================
// TARGET "BRAIN"
// =====================================================
function updateTarget(dt) {
  const t = game.target;

  t.bubT = Math.max(0, t.bubT - dt); t.hop = Math.max(0, t.hop - dt);
  t.fast = Math.max(0, t.fast - dt); t.rush = Math.max(0, t.rush - dt);

  // His distance ahead depends on the catch meter. Now and then he briefly dashes (a small, fair burst).
  const hard = clamp(game.distance / LEVEL_LENGTH, 0, 1);       // 0 early, 1 near the mansion
  const burst = t.rush > 0 ? 0.045 * (1 + 0.8 * hard) * Math.sin(Math.PI * (1 - t.rush)) : 0;
  const goal = 0.34 + (game.meter / 100) * 0.5 + Math.sin(game.time * 0.7) * 0.02 - burst;
  t.s += (goal - t.s) * Math.min(1, dt * 4);

  // taunting, quick lane changes and dashes
  t.tauntTimer -= dt;
  if (t.tauntTimer <= 0) {
    t.tauntTimer = 9 + Math.random() * 8;
    if (t.looking <= 0) { t.looking = 1.0; t.bubble = SPR.bubHa; t.bubT = 1.0; }          // looks back and laughs
  }
  t.dashTimer -= dt;
  if (t.dashTimer <= 0) {
    t.dashTimer = (7 - 3 * hard) + Math.random() * (6 - 2 * hard);
    const opts = [t.lane - 1, t.lane + 1].filter(l => l >= 0 && l <= 2 && !laneBlocked(l));
    if (opts.length) { t.lane = opts[Math.floor(Math.random() * opts.length)]; t.fast = 0.45; }
  }
  t.rushTimer -= dt;
  if (t.rushTimer <= 0) { t.rushTimer = (14 - 6 * hard) + Math.random() * (10 - 4 * hard); t.rush = 1.0; }

  // Every few seconds he picks a random lane
  t.laneTimer -= dt;
  if (t.laneTimer <= 0) {
    t.lane = Math.floor(Math.random() * 3);
    t.laneTimer = 1.5 + Math.random() * 2.5;
  }

  // He looks back more often when you're close, and even more near the mansion
  t.lookTimer -= dt;
  if (t.lookTimer <= 0) {
    t.looking = 1.2;
    let wait = game.meter > 70 ? 1.5 + Math.random() * 1.5 : 4 + Math.random() * 4;
    if (game.meter > 85) wait *= 0.6;                         // very close: he keeps glancing back
    wait *= 1 - 0.5 * game.intensity;
    t.lookTimer = wait;
  }
  t.looking -= dt;

  // If an obstacle is coming at him, he dodges into a free lane
  function laneBlocked(l) {
    return game.obstacles.some(o => o.lane === l && o.s > t.s - 0.15 && o.s < t.s + 0.03);
  }
  if (laneBlocked(t.lane)) {
    const van = game.obstacles.find(o => o.type === 'van' && o.lane === t.lane && o.s > t.s - 0.15 && o.s < t.s + 0.03);
    if (van && t.bubT <= 0) { t.bubble = SPR.bubWhoa; t.bubT = 0.8; t.hop = 0.3; }      // reacts to the van
    const free = [0, 1, 2].filter(l => !laneBlocked(l));
    if (free.length > 0) t.lane = free[Math.floor(Math.random() * free.length)];
  }

  // he likes grabbing APPLE JUICE that he can see ahead of him
  for (const p of game.picks) {
    if (p.type === 'juice' && !p.done && p.want && p.s < t.s - 0.02 && t.s - p.s < 0.5 &&
        p.lane !== t.lane && !laneBlocked(p.lane)) { t.lane = p.lane; break; }
  }

  // Slide smoothly to his lane
  t.displayLane += (t.lane - t.displayLane) * Math.min(1, dt * (t.fast > 0 ? 22 : 10));
}

// ---------- CASE COINS and APPLE JUICE ----------
function pickBusy(lane, minGap) {
  return game.obstacles.some(o => o.lane === lane && o.s < minGap) ||
         game.items.some(i => i.lane === lane && Math.abs(i.s) < 0.06) ||
         game.picks.some(p => p.lane === lane && Math.abs(p.s) < 0.06);
}

function collectCoin(p) {
  p.done = true;
  game.coins++;
  totalCoins++;
  saveCoins();
  game.coinPop = 1;
  sfx('coin');
  const px = laneX(game.displayLane, 1);
  const py = BOTTOM - 100;
  sparkle(px, py, '#ffd400', 10);
  game.floats.push({ x: px, y: py - 60, text: '+1', color: '#ffd400', life: 0.8, size: 26 });
}

function collectPower(p) {
  p.done = true;
  const px = laneX(game.displayLane, 1), py = BOTTOM - 110;
  let text = '', color = '#ffffff';
  if (p.kind === 'magnet') { game.magnetT = 8; text = 'COIN MAGNET!'; color = '#ff8aa0'; }
  else if (p.kind === 'shield') { game.shield = true; text = 'SHIELD!'; color = '#7fc8ff'; }
  else { game.boostT = 10; text = 'x2 SCORE!'; color = '#ffd400'; }
  sparkle(px, py, color, 14);
  sfx('power');
  sfx(p.kind === 'magnet' ? 'magnet' : (p.kind === 'shield' ? 'shieldGet' : 'boost'));
  game.floats.push({ x: px, y: py - 30, text: text, color: color, life: 1.0, size: 22 });
}

function takeJuice(p) {
  p.done = true;
  game.juice++;
  const t = game.target;
  const tx = laneX(t.displayLane, t.s), ty = groundY(t.s) - 60 * t.s * 1.5;
  sparkle(tx, ty, '#ffd84a', 10);
  t.hop = 0.55; t.bubble = SPR.bubYum; t.bubT = 0.9; t.looking = Math.max(t.looking, 0.7);   // funny little pickup dance
  game.floats.push({ x: tx, y: ty - 20, text: '+JUICE', color: '#ffd84a', life: 0.9, size: 14 });
}

// how the chase gets harder step by step: 0-1000 easy, 1000-2000 medium, 2000-2750 hard, 2750-3500 the final push
function bandCalm() {              // bigger = more time between obstacles
  const d = game.distance;
  return d < 1000 ? 1.18 : (d < 2000 ? 1.0 : (d < 2750 ? 0.9 : 0.84));
}
function bandRich() {              // bigger = more coins (the world also gets faster, so the numbers per 100m stay generous)
  const d = game.distance;
  return (d < 1000 ? 1.0 : (d < 2000 ? 1.2 : (d < 2750 ? 1.35 : 1.5))) * Math.pow(Math.max(0.55, game.speed) / 0.55, 0.5);
}
function bandJuice() {             // bigger = more APPLE JUICE for the target to grab as the party gets closer
  const d = game.distance;
  return (d < 1000 ? 1.0 : (d < 2000 ? 1.2 : (d < 2750 ? 1.4 : 1.6))) * Math.pow(Math.max(0.55, game.speed) / 0.55, 0.5);
}
function updatePicks(dt) {
  // coin trails: 4 to 7 coins in one lane
  game.coinTimer -= dt;
  const tr = game.coinTrail;
  if (tr.left <= 0 && game.coinTimer <= 0) {
    tr.left = 4 + Math.floor(Math.random() * 4);
    tr.lane = Math.floor(Math.random() * 3);
    tr.timer = 0;
    game.coinTimer = (3 + Math.random() * 3) / bandRich();
  }
  if (tr.left > 0) {
    tr.timer -= dt;
    if (tr.timer <= 0) {
      if (!pickBusy(tr.lane, 0.15)) game.picks.push({ cls: 'pk', type: 'coin', lane: tr.lane, lx: tr.lane, s: 0, done: false, phase: Math.random() * 6 });
      tr.left--;
      tr.timer = 0.1 / Math.max(0.3, game.vs);
    }
  }
  // party favors for the target
  game.juiceTimer -= dt;
  if (game.juiceTimer <= 0) {
    game.juiceTimer = (3.5 + Math.random() * 3.5) / bandJuice();
    const lane = Math.floor(Math.random() * 3);
    if (!pickBusy(lane, 0.2)) {
      game.picks.push({ cls: 'pk', type: 'juice', lane: lane, s: 0, done: false, want: Math.random() < 0.75, phase: Math.random() * 6 });
    }
  }
  // power-ups are uncommon: one every 18 to 32 seconds
  game.pwrTimer -= dt;
  if (game.pwrTimer <= 0) {
    game.pwrTimer = (18 + Math.random() * 14) * (shopSave.lucky ? 0.65 : 1);   // LUCKY CASE (shop)
    const lane = Math.floor(Math.random() * 3);
    const kinds = ['magnet', 'shield', 'boost'];
    if (game.time > 8 && !pickBusy(lane, 0.2)) {
      game.picks.push({ cls: 'pk', type: 'pwr', kind: kinds[Math.floor(Math.random() * 3)], lane: lane, lx: lane, s: 0, done: false, phase: Math.random() * 6 });
    }
  }
  game.magnetT = Math.max(0, game.magnetT - dt);
  game.boostT = Math.max(0, game.boostT - dt);
  game.maxT = Math.max(0, game.maxT - dt);
  game.msT = Math.max(0, game.msT - dt);

  const t = game.target;
  for (const p of game.picks) {
    p.s += game.vs * dt;
    if (p.done) continue;
    if (p.type === 'coin') {
      if (game.magnetT > 0 && p.s > 0.35) p.lx += (game.displayLane - p.lx) * Math.min(1, dt * 6);   // COIN MAGNET pull
      const reach = game.magnetT > 0 ? 0.85 : 0.92;
      if (p.s > reach && p.s < 1.08 && Math.abs(game.displayLane - p.lx) < 0.55) collectCoin(p);
      else if (p.s >= 1.08) p.done = true;
    } else if (p.type === 'pwr') {
      if (p.s > 0.92 && p.s < 1.08 && Math.abs(game.displayLane - p.lx) < 0.55) collectPower(p);
      else if (p.s >= 1.08) p.done = true;
    } else {
      if (Math.abs(p.s - t.s) < 0.05 + game.vs * dt && Math.abs(t.displayLane - p.lane) < 0.5) takeJuice(p);
      else if (p.s >= 1.1) p.done = true;
    }
  }
  game.picks = game.picks.filter(p => !p.done);
}

// ---------- SPAWNING ITEM TRAILS ----------
function spawnItem(lane) {
  if (game.obstacles.some(o => o.lane === lane && Math.abs(o.s) < 0.1)) return;
  const r = Math.random();
  const type = r < 0.6 ? 'oyl' : (r < 0.92 ? 'phone' : 'key');
  game.items.push({ cls: 'it', lane: lane, s: 0, type: type, done: false, phase: Math.random() * 6 });
}

function updateTrails(dt) {
  game.itemTimer -= dt;
  if (game.trail.left <= 0 && game.itemTimer <= 0) {
    game.trail.left = 3 + Math.floor(Math.random() * 4);   // 3 to 6 items
    game.trail.lane = Math.floor(Math.random() * 3);
    game.trail.timer = 0;
  }
  if (game.trail.left > 0) {
    game.trail.timer -= dt;
    if (game.trail.timer <= 0) {
      spawnItem(game.trail.lane);
      game.trail.timer = 0.2;
      game.trail.left--;
      if (game.trail.left === 0) game.itemTimer = 1.2 + Math.random() * 1.2;
    }
  }
}

// lanes that a van or a big block is about to occupy (so we never block all three)
function busyLanes() {
  const set = [];
  for (const o of game.obstacles) {
    if ((o.type === 'van' || o.type === 'block') && o.s < 0.92) {
      if (set.indexOf(o.lane) < 0) set.push(o.lane);
      if (o.swapTo !== undefined && set.indexOf(o.swapTo) < 0) set.push(o.swapTo);
    }
  }
  return set;
}

// Paparazzi vans: ONE VAN, DOUBLE VAN, or a FAKE-OUT. At least one lane always stays free.
function spawnVans(free, p) {
  const busy = busyLanes();
  const room = 2 - busy.length;
  if (room <= 0) return -1;                                   // no safe way to add a van right now
  const cand = free.filter(l => busy.indexOf(l) < 0);
  if (cand.length === 0) return -1;
  const variant = Math.floor(Math.random() * 3);
  const roll = Math.random();
  const dbl = 0.08 + 0.4 * p, fake = p < 0.15 ? 0 : 0.2;
  game.warnT = 1.6;
  sfx('warn');
  game.warnText = 'PAPARAZZI INCOMING \u2014 AVOID!';
  if (room >= 2 && cand.length >= 2 && roll < dbl) {          // DOUBLE VAN
    const a = cand[Math.floor(Math.random() * cand.length)];
    const others = cand.filter(l => l !== a);
    const b = others[Math.floor(Math.random() * others.length)];
    game.obstacles.push({ cls: 'ob', lane: a, s: 0, type: 'van', variant: variant, phase: Math.random() * 6 });
    game.obstacles.push({ cls: 'ob', lane: b, s: 0, type: 'van', variant: (variant + 1) % 3, phase: Math.random() * 6 });
    game.warnText = 'PAPARAZZI INCOMING \u2014 MOVE!';
    return 0.8;                                               // breathing room after a double
  }
  const a = cand[Math.floor(Math.random() * cand.length)];
  if (room >= 2 && roll > 1 - fake) {                         // FAKE-OUT: slides into the next lane early
    const nb = [a - 1, a + 1].filter(l => l >= 0 && l <= 2 && busy.indexOf(l) < 0 && free.indexOf(l) >= 0);
    if (nb.length) {
      game.obstacles.push({ cls: 'ob', lane: a, s: 0, type: 'van', variant: variant, phase: Math.random() * 6,
                            swapTo: nb[Math.floor(Math.random() * nb.length)], swapAt: 0.3 });
      return 0.6;
    }
  }
  game.obstacles.push({ cls: 'ob', lane: a, s: 0, type: 'van', variant: variant, phase: Math.random() * 6 });   // ONE VAN
  return 0.3;
}

function pickBlockVariant() {
  const r = Math.random();
  if (r < 0.25) return 0;
  if (r < 0.40) return 1;
  if (r < 0.55) return 2;
  if (r < 0.70) return 3;
  if (r < 0.85) return 4;
  return 5;
}

// =====================================================
// UPDATE (runs every frame)
// =====================================================
function update(dt) {
  if (game.paused) return;       // paused: nothing in the world moves at all
  // after the run ends, only the end-screen animations keep going
  if (game.over) {
    game.endTimer += dt;
    game.shake = Math.max(0, game.shake - dt);
    game.comboPop = Math.max(0, game.comboPop - dt * 4);
    updateParticles(dt);
    return;
  }

  game.time += dt;
  game.invincible -= dt;
  game.stumble -= dt;
  game.hitFlash -= dt;
  game.camFlash = Math.max(0, game.camFlash - dt);
  game.warnT = Math.max(0, game.warnT - dt);
  game.coinPop = Math.max(0, game.coinPop - dt * 4);
  game.shake = Math.max(0, game.shake - dt);
  game.comboPop = Math.max(0, game.comboPop - dt * 4);

  // which district are we in, and how tense is the chase?
  const mLeft = metersLeft();
  game.intensity = clamp((750 - mLeft) / 750, 0, 1);         // the final 750m build up the tension
  updatePalette(mLeft);
  if (PAL.cur !== game.zoneIdx) {            // entering a new district: show its name
    game.zoneIdx = PAL.cur;
    game.bannerT = 3.2;
  }
  game.bannerT = Math.max(0, game.bannerT - dt);

  // distance milestone messages
  for (let i = 0; i < MILESTONES.length; i++) {
    const m = MILESTONES[i];
    if (mLeft <= m[0] && !game.msDone[m[0]]) { game.msDone[m[0]] = true; game.msText = m[1]; game.msT = 2.4; }
  }

  // speed grows over time (and a little more in the final 500m), but drops while stumbling
  // (speed now depends on how far you have run: easy start, smooth climb, hardest in the last 750m)
  const dd = game.distance;
  const topSpeed = (0.55 + 0.62 * clamp(dd / 2750, 0, 1) + 0.25 * clamp((dd - 2750) / 750, 0, 1)) * (1 + 0.1 * game.intensity);
  const goalSpeed = game.stumble > 0 ? topSpeed * 0.5 : topSpeed;
  game.speed += (goalSpeed - game.speed) * Math.min(1, dt * 6);

  game.vs = calmSpeed(game.speed);
  game.distance += game.speed * dt * 40;
  if (game.distance > LEVEL_LENGTH) game.distance = LEVEL_LENGTH;   // the chase never goes past the mansion
  game.roadPos += game.vs * dt;
  game.markPos += game.vs * dt * MARK_SPEED;
  game.sidePos += game.vs * dt * SIDE_SPEED;

  updateScenery(dt);
  updateSkyEvents(dt);
  updateAir(dt);

  // He reached the mansion first
  if (metersLeft() <= 0) {
    endRun('escaped');
    return;
  }

  // smooth lane sliding
  game.displayLane += (game.lane - game.displayLane) * Math.min(1, dt * 14);

  // jumping
  if (game.jumpY > 0 || game.vy > 0) {
    game.vy -= 1800 * dt;
    game.jumpY += game.vy * dt;
    if (game.jumpY <= 0) { game.jumpY = 0; game.vy = 0; }
  }

  // sliding countdown
  game.slideTime -= dt;

  // spawn new obstacles (not on top of fresh items)
  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) {
    const free = [0, 1, 2].filter(l => !game.items.some(i => i.lane === l && Math.abs(i.s) < 0.1) && !game.picks.some(p => p.lane === l && Math.abs(p.s) < 0.1));
    if (free.length === 0) {
      game.spawnTimer = 0.15;     // try again very soon
    } else {
      const r = Math.random();
      let pause = 0;
      const prog = clamp(game.distance / LEVEL_LENGTH, 0, 1);      // 0 = start of the chase, 1 = the mansion
      let vanPause = -1;
      // paparazzi: none in the first 200m, then more and more often (a little extra in the final stretch)
      const vanChance = game.distance < 200 ? 0 : 0.02 + 0.26 * prog + (game.distance > 2750 ? 0.05 : 0);
      if (Math.random() < vanChance) vanPause = spawnVans(free, prog);   // paparazzi vans drive toward you
      if (vanPause >= 0) {
        pause = vanPause;
      } else {
        const bp = 0.25 + 0.17 * prog;                                  // solid blocks get more common
        let type = r < bp ? 'block' : (r < bp + (1 - bp) / 2 ? 'low' : 'high');
        if (type === 'block' && busyLanes().length >= 2) type = 'low';       // never block every lane
        let variant;
        if (type === 'block') variant = pickBlockVariant();
        else if (type === 'low') variant = Math.floor(Math.random() * 4);
        else variant = Math.floor(Math.random() * 3);
        const lane1 = free[Math.floor(Math.random() * free.length)];
        game.obstacles.push({ cls: 'ob', lane: lane1, s: 0, type: type, variant: variant });
        // later in the chase: sometimes a second obstacle next to it (jump-or-slide only, never a block)
        const others = free.filter(l => l !== lane1);
        if (game.distance > 1000 && others.length > 0 && Math.random() < 0.05 + 0.34 * prog) {
          const t2 = Math.random() < 0.5 ? 'low' : 'high';
          game.obstacles.push({ cls: 'ob', lane: others[Math.floor(Math.random() * others.length)], s: 0, type: t2,
                                variant: t2 === 'low' ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 3) });
        }
      }
      // gaps get shorter with distance, but never unfair
      game.spawnTimer = pause + Math.max(0.5, (1.5 - 0.5 * prog) * PAL.traffic * (1 - 0.22 * game.intensity) * (1.35 - 0.7 * prog) * bandCalm());
    }
  }

  // move obstacles and check for crashes
  const vk = game.speed > 0.01 ? game.vs / game.speed : 1;
  for (const ob of game.obstacles) {
    ob.s += (ob.type === 'van' ? (0.55 + 0.35 * game.speed) : game.speed) * vk * dt;      // (same behaviour, just calmer on screen)
    if (ob.lx === undefined) ob.lx = ob.lane;
    if (ob.swapTo !== undefined && ob.s > ob.swapAt) { ob.lane = ob.swapTo; ob.swapTo = undefined; }   // fake-out: slide over
    ob.lx += (ob.lane - ob.lx) * Math.min(1, dt * 5);
    const inLane = Math.abs(game.displayLane - ob.lx) < 0.5;
    const big = ob.type === 'van' || (ob.type === 'block' && !PARKED_CAR[ob.variant]);   // (jumping a parked car is not a PERFECT DODGE)
    // was the player in this lane until the very last moment? (for PERFECT DODGE)
    if (big && ob.s > 0.72 && ob.s < 0.93 && inLane && game.invincible <= 0) ob.late = true;

    // you can't be hit while "invincible" (right after a crash)
    if (game.invincible <= 0 && ob.s > 0.93 && ob.s < 1.03 && inLane) {
      let hit = false;
      if (ob.type === 'van') hit = true;
      if (ob.type === 'block') hit = !(PARKED_CAR[ob.variant] && game.jumpY >= parkedClear(ob.variant));   // parked car: jump clears it
      if (ob.type === 'low' && game.jumpY < 35) hit = true;
      if (ob.type === 'high' && game.slideTime <= 0) hit = true;
      if (hit) {
        ob.judged = true;
        if (game.shield) shieldBreak(); else crash();
        ob.s = 2;     // the obstacle you hit disappears
      }
    }
    // it went past without hitting you
    if (!ob.judged && ob.s >= 1.03) {
      ob.judged = true;
      if (ob.type === 'van') game.vansDodged++;
      if (ob.late && big) perfectDodge();
    }
  }
  game.obstacles = game.obstacles.filter(ob => ob.s < 1.25);

  // spawn items, move them, and check if you grabbed or missed them
  updateTrails(dt);
  updatePicks(dt);
  for (const it of game.items) {
    it.s += game.vs * dt;
    if (it.done) continue;
    if (it.s > 0.92 && it.s < 1.08 && Math.abs(game.displayLane - it.lane) < 0.55) {
      collect(it);
    } else if (it.s >= 1.08) {
      it.done = true;      // it slipped past you
      breakCombo();
    }
  }
  game.items = game.items.filter(it => !it.done);

  updateTarget(dt);

  // the catch meter fills up while you run
  const inHisLane = Math.abs(game.displayLane - game.target.displayLane) < 0.6;
  let rate = BASE_FILL * (1 - 0.3 * clamp(game.distance / LEVEL_LENGTH, 0, 1)) + (inHisLane ? LANE_BONUS : 0);   // he gets slipperier
  if (game.stumble > 0) rate = 0;      // no progress while you're stumbling
  game.meter = Math.min(100, game.meter + rate * dt);

  updateParticles(dt);

  // meter full = CAUGHT!
  if (game.meter >= 100) endRun('caught');
}

// =====================================================
// DRAW: BACKGROUND
// =====================================================
function flick(phase) {   // a neon sign that sometimes flickers
  return Math.sin(game.time * 2.3 + phase * 5) > -0.92 ? 0.75 + 0.25 * Math.sin(game.time * 9 + phase) : 0.15;
}

function drawSkyLayer(layer, x, y, h) {
  ctx.globalAlpha = 1 - PAL.t;
  ctx.drawImage(SPR.skyline[PAL.a][layer], x, y, 600, h);
  if (PAL.t > 0.01) {
    ctx.globalAlpha = PAL.t;
    ctx.drawImage(SPR.skyline[PAL.b][layer], x, y, 600, h);
  }
  ctx.globalAlpha = 1;
}

function drawLandmarks(sh) {
  const m = metersLeft();
  for (let i = 0; i < LMK.length; i++) {
    const L = LMK[i];
    if (m > L.from || m < L.to) continue;
    const p = (L.from - m) / (L.from - L.to);          // 0 = far away ... 1 = passing by
    let a = Math.min(1, (1 - p) * 5);
    if (L.from < 1740) a = Math.min(a, p * 5);
    const spr = SPR.lm[L.key];
    const hh = L.h * (0.55 + 0.6 * p);
    const ww = hh * spr.width / spr.height;
    const cx = W / 2 + (L.x - W / 2) * (1 + p * 0.9) - sh * L.par;
    const top = HORIZON + 2 - hh;
    ctx.globalAlpha = a * 0.92;
    ctx.drawImage(spr, cx - ww / 2, top, ww, hh);
    ctx.globalAlpha = 1;
    if (L.beacon) glowAt('red', cx, top + hh * 0.01 + 2, 22, a * (Math.floor(game.time * 1.5) % 2 === 0 ? 0.9 : 0.2));
    if (L.flicker) glowAt('pink', cx, top + hh * 0.25, ww * 1.2, a * 0.5 * flick(2));
  }
}

function drawWater(sh) {
  const w = PAL.water;
  if (w < 0.02) return;
  const y0 = HORIZON - 16;
  const g = ctx.createLinearGradient(0, y0, 0, HORIZON);
  g.addColorStop(0, 'rgba(24,60,120,' + (0.85 * w).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(10,30,70,' + (0.95 * w).toFixed(3) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, W, 16);
  // sparkles on the water
  for (let i = 0; i < 18; i++) {
    const x = ((i * 37 + game.time * (6 + (i % 3) * 3)) % (W + 20)) - 10;
    const y = y0 + 2 + (i * 5) % 13;
    ctx.fillStyle = 'rgba(255,170,200,' + (0.35 * w).toFixed(3) + ')';
    ctx.fillRect(x, y, 3 + (i % 3) * 2, 1);
  }
  // little boats far away
  for (let i = 0; i < 3; i++) {
    const x = ((game.time * 5 + i * 160) % 520) - 60 - sh * 12;
    ctx.globalAlpha = w;
    ctx.fillStyle = '#e8e0f0';
    ctx.fillRect(x, y0 + 8, 10, 2);
    ctx.fillStyle = i === 1 ? '#ffd400' : '#ff4fd8';
    ctx.fillRect(x + 4, y0 + 2, 1, 6);
    ctx.fillRect(x + 5, y0 + 3, 3, 4);
    ctx.globalAlpha = 1;
  }
  // the bridge
  if (w > 0.25) {
    const a = clamp((w - 0.25) * 2, 0, 1);
    const bx = -60 - sh * 10, bt = HORIZON - 8 - 37 * 3;
    ctx.globalAlpha = a * 0.95;
    ctx.drawImage(SPR.bridge, bx, bt, 480, 126);
    ctx.globalAlpha = 1;
    for (let i = 0; i < 6; i++) {            // moving car lights on the bridge deck
      const x = ((game.time * 40 + i * 80) % 520) - 40 - sh * 10;
      ctx.fillStyle = i % 2 ? 'rgba(255,60,80,' + a + ')' : 'rgba(255,246,192,' + a + ')';
      ctx.fillRect(x, bt + 34 * 3 - 3, 3, 2);
    }
  }
}

// ----- SKY EVENTS: all of these live in the background and can never hurt the player -----
const PLANE_AT = [2050, 2500, 2950];               // the FREE 67 plane passes three times, between 2,000m and the mansion
const PLANE_SPEED = 125;                           // pixels per second (background speed, much slower than the road)
function heliGap(d) {                                          // the news helicopter: rare at first, then more and more often
  return d < 2200 ? 5 + Math.random() * 4 : (d < 2750 ? 3 + Math.random() * 2.5 : 1.2 + Math.random() * 1.6);
}
function planeSoon(d) {                                        // the banner plane is about to arrive (or is on screen)
  const p = game.plane;
  return p.on || (p.n < PLANE_AT.length && d >= PLANE_AT[p.n] - 100);
}
function updateSkyEvents(dt) {
  const d = game.distance, h = game.heli, p = game.plane;
  const planeBusy = planeSoon(d);                           // plane event time: the sky belongs to the plane
  if (h.on) {
    if (planeBusy && !p.on) h.v = 170;                      // helicopter hurries off before the plane comes
    h.x += h.v * dt;
    if (h.x > W + 140) { h.on = false; h.wait = heliGap(d); }
  } else if (d >= 1800 && !planeBusy && !p.on) {            // AIRPLANE ON SCREEN (or coming) = NO HELICOPTER
    h.wait -= dt;
    if (h.wait <= 0) { h.on = true; h.x = -130; h.v = 46 + Math.random() * 8; }
  }
  if (p.on) {
    p.x += PLANE_SPEED * dt;
    if (p.x > W + 300) {                                    // plane and banner have completely left the screen
      p.on = false;
      h.wait = Math.min(h.wait, 2.5);                                 // after a pass the helicopter may come back soon
      if (p.n >= PLANE_AT.length) p.done = true;
    }
  } else if (!p.done && p.n < PLANE_AT.length && d >= PLANE_AT[p.n] && !h.on) {
    p.on = true; p.x = 0; p.n++;
  }
}
// ----- DISTANT AIR TRAFFIC: tiny planes, helicopters and blinking lights far away. Pure background. -----
function airProgress() { return clamp(game.distance / LEVEL_LENGTH, 0, 1); }
// far-away aircraft: 0-750m a few dim lights, 750-1500 occasional distant planes, 1500-2500 more, 2500-3500 the busiest sky
function updateAir(dt) {
  const p = airProgress(), d = game.distance, list = game.air;
  const pl = game.plane;
  const special = planeSoon(d), heliOn = game.heli.on;   // (also hides them a moment BEFORE the plane arrives)
  let j = 0;
  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    o.x += o.v * o.dir * dt;
    const hide = (o.k === 'heli' && (special || heliOn)) || (o.k === 'plane' && o.layer !== 0 && special);   // never confuse the special plane / helicopter
    o.a += ((hide ? 0 : 1) - o.a) * Math.min(1, dt * 10);
    if (o.x > -30 && o.x < W + 30) list[j++] = o;           // off-screen ones are removed
  }
  list.length = j;
  game.airT -= dt;
  if (game.airT <= 0) {
    game.airT = (d < 750 ? 7 : (d < 1500 ? 4.5 : (d < 2500 ? 3 : 2))) * (0.7 + Math.random() * 0.6);
    if (list.length < (d < 750 ? 2 : (d < 1500 ? 3 : (d < 2500 ? 4 : 5)))) {   // busier sky as the chase goes on, never crowded
      const r = Math.random();
      const farW = d < 750 ? 1 : (d < 1500 ? 0.62 : (d < 2500 ? 0.36 : 0.22)), midW = d < 1500 ? 0.38 : 0.4;
      const layer = r < farW ? 0 : (r < farW + midW ? 1 : 2);
      const heliChance = d < 1200 ? 0 : (d < 2000 ? 0.32 : (d < 2500 ? 0.42 : 0.52));
      const k = layer === 0 ? 'plane' : (Math.random() < heliChance ? 'heli' : 'plane');
      const dir = Math.random() < 0.5 ? 1 : -1;
      const v = layer === 0 ? 5 + Math.random() * 7 : (layer === 1 ? 16 + Math.random() * 12 : 36 + Math.random() * 18) * (k === 'heli' ? 0.55 : 1);
      const y = layer === 0 ? 56 + Math.random() * 94 : (layer === 1 ? 70 + Math.random() * 80 : 66 + Math.random() * 52);
      list.push({ layer: layer, k: k, dir: dir, v: v, x: dir > 0 ? -24 : W + 24, y: y, ph: Math.random() * 6, a: 0 });
    }
  }
}
function drawAir(layer) {
  const list = game.air;
  if (!list.length) return;
  const t = game.time, sh = game.displayLane - 1;
  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    if (o.layer !== layer || o.a < 0.03) continue;
    const x = Math.round(o.x - sh * (layer === 0 ? 2 : layer === 1 ? 4 : 6)), y = Math.round(o.y);
    const blink = Math.floor(t * 1.3 + o.ph) % 2 === 0;
    const strobe = ((t * 0.9 + o.ph) % 1.4) < 0.1;
    if (layer === 0) {                                      // very far: a dim moving star with a blinking light
      ctx.globalAlpha = 0.45 * o.a;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, 2, 1);
      if (blink) { ctx.fillStyle = '#ff2a4d'; ctx.fillRect(x - o.dir, y, 1, 1); }
      ctx.globalAlpha = 1;
    } else if (o.k === 'heli') {                            // distant helicopter silhouette
      const hx = x - 4, f = o.dir;
      ctx.globalAlpha = (layer === 1 ? 0.7 : 0.9) * o.a;
      ctx.fillStyle = '#4a4a7c';
      ctx.fillRect(hx, y, layer === 1 ? 6 : 8, layer === 1 ? 2 : 3);
      ctx.fillRect(f > 0 ? hx - 4 : hx + (layer === 1 ? 6 : 8), y, 4, 1);          // tail
      const rw = Math.floor(t * 18) % 2 ? (layer === 1 ? 9 : 12) : (layer === 1 ? 5 : 7);
      ctx.fillRect(hx + ((layer === 1 ? 6 : 8) - rw) / 2, y - 2, rw, 1);          // spinning rotor
      if (blink) { ctx.fillStyle = '#ff2a4d'; ctx.fillRect(f > 0 ? hx - 4 : hx + (layer === 1 ? 10 : 12) - 1, y, 1, 1); }
      ctx.globalAlpha = 1;
    } else {                                                // distant plane: little body, tail and navigation lights
      const L = layer === 1 ? 7 : 13, H = layer === 1 ? 2 : 3;
      const bx = o.dir > 0 ? x - L : x;
      ctx.globalAlpha = (layer === 1 ? 0.65 : 0.85) * o.a;
      ctx.fillStyle = '#5a5a8c';
      ctx.fillRect(bx, y, L, H);
      ctx.fillRect(o.dir > 0 ? bx : bx + L - 2, y - 2, 2, 2);                       // tail fin
      ctx.fillRect(bx + (L >> 1) - 1, y - 1, 3, 1);                                  // wing
      ctx.fillStyle = '#ffe9a8'; if (layer === 2) for (let w = 2; w < L - 3; w += 2) ctx.fillRect(bx + w, y + 1, 1, 1);   // cabin windows
      if (blink) { ctx.fillStyle = '#ff2a4d'; ctx.fillRect(bx + (L >> 1), y - 2, 1, 1); }
      if (strobe) { ctx.fillStyle = '#ffffff'; ctx.fillRect(o.dir > 0 ? bx + L : bx - 1, y, 1, 1); }
      ctx.globalAlpha = 1;
      if (layer === 2 && blink && o.a > 0.5) glowAt('red', bx + (L >> 1) + 0.5, y - 1.5, 9, 0.5);
    }
  }
}

// the airplane towing the banner (flies left to right, so the banner reads normally)
function drawPlane(sh) {
  const p = game.plane;
  if (!p.on) return;
  const t = game.time;
  const px = p.x - sh * 3;
  const py = 138 + Math.sin(t * 0.9) * 4;       // just under the HUD, above the city
  const bw = 176, bh = 40, rope = 26;
  const bx = px - 72 - rope - bw;                  // the banner trails behind the plane
  if (bx < W && bx + bw > -10) {
    ctx.strokeStyle = '#d8d8e8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px - 70, py + 14); ctx.lineTo(bx + bw, py + 12 + Math.sin(t * 5) * 1.5); ctx.stroke();
    for (let c = 0; c < 44; c++) {                 // wavy flag: each pixel column ripples
      const wave = Math.sin(c * 0.3 - t * 5) * (0.4 + (43 - c) * 0.035) + Math.sin(t * 1.3) * 1.5;
      ctx.drawImage(SPR.planeBanner, c, 0, 1, 10, Math.round(bx + c * 4), Math.round(py - 4 + wave), 4, bh);
    }
  }
  ctx.drawImage(SPR.plane, px - 72, py, 72, 30);
  if (Math.floor(t * 2) % 2 === 0) glowAt('red', px - 68, py + 4, 12, 0.8);
}

// the news helicopter drifts across the night sky, high above the road
function drawHelicopter(sh) {
  const t = game.time;
  let hx = ((t * 9) % 620) - 110 - sh * 8;                  // (the home screen keeps its slow drifting helicopter)
  const hy = 150 + Math.sin(t * 0.5) * 8;
  if (screen === 'play') {
    if (!game.heli.on) return;                              // no helicopter before 2,000m, and none between visits
    hx = game.heli.x - 50 - sh * 8;
  }
  if (hx < -110 || hx > W + 110) return;
  const sx = hx + 24, sy = hy + 36;                       // where the light leaves the helicopter
  // sometimes the light swings toward the chase
  const chasing = ((t % 16) > 10 && (t % 16) < 14.5) || game.meter >= 80 || (game.intensity > 0.6 && (t % 8) > 3);
  const goal = chasing ? Math.atan2(W / 2 - sx, HORIZON + 40 - sy) : Math.sin(t * 0.9) * 0.55;
  game.heliAng += (goal - game.heliAng) * 0.06;
  const a = game.heliAng;
  const len = 200;
  const ex = sx + Math.sin(a) * len, ey = sy + Math.cos(a) * len;
  const px = Math.cos(a) * 24, py = -Math.sin(a) * 24;     // sideways spread at the far end
  const flicker = Math.sin(t * 31) > 0.92 ? 0.4 : 1;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,250,200,' + (0.1 * flicker).toFixed(3) + ')';
  ctx.beginPath();
  ctx.moveTo(sx - 2, sy); ctx.lineTo(sx + 2, sy);
  ctx.lineTo(ex + px, ey + py); ctx.lineTo(ex - px, ey - py);
  ctx.closePath();
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  glowAt('warm', ex, ey, 70, 0.3 * flicker);
  ctx.drawImage(SPR.heli[Math.floor(t * 20) % 2], hx, hy, 100, 40);
  if (Math.floor(t * 1.4) % 2 === 0) glowAt('red', hx + 95, hy + 5, 14, 0.9);
}

function drawBackground() {
  // sky: gradient made from the blended district colours
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  g.addColorStop(0, rgb(PAL.skyTop));
  g.addColorStop(0.5, rgb(PAL.skyMid));
  g.addColorStop(0.85, rgb(PAL.skyLow));
  g.addColorStop(1, rgb(PAL.skyHor));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, HORIZON);

  for (let i = 0; i < STARS.length; i++) {
    const st = STARS[i];
    const a = (0.4 + 0.6 * Math.abs(Math.sin(game.time * 1.5 + st.p))) * PAL.stars;
    ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
    const size = st.big ? 2 : 1;
    ctx.fillRect(st.x, st.y, size, size);
  }

  glowAt('warm', 360, 174, 130, 0.25);
  blit(SPR.moon, 336, 150, 48, 48);

  // a small plane blinking across the sky now and then
  if ((game.time % 40) < 24) {
    const px = ((game.time % 40) / 24) * 520 - 60;
    const py = 70 + Math.sin(game.time * 0.2) * 8;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(px, py, 2, 1);
    if (Math.floor(game.time * 1.2) % 2 === 0) {
      ctx.fillStyle = '#ff2a4d';
      ctx.fillRect(px + 2, py - 1, 2, 2);
    }
  }

  // the skyline layers slide by different amounts when you change lanes (parallax)
  const sh = game.displayLane - 1;
  const air = screen === 'play';
  if (air) drawAir(0);
  drawSkyLayer(0, -100 - sh * 6,  HORIZON - 120, 120);
  if (air) drawAir(1);
  drawLandmarks(sh);
  drawSkyLayer(1, -100 - sh * 11, HORIZON - 100, 100);
  if (air) drawAir(2);
  drawSkyLayer(2, -100 - sh * 18, HORIZON - 80,  80);

  // pink haze on the horizon
  const hz = ctx.createLinearGradient(0, HORIZON - 40, 0, HORIZON);
  hz.addColorStop(0, rgba(PAL.haze, 0));
  hz.addColorStop(1, rgba(PAL.haze, 0.28));
  ctx.fillStyle = hz;
  ctx.fillRect(0, HORIZON - 40, W, 40);

  drawWater(sh);
  if (screen === 'play') drawPlane(sh);
  drawHelicopter(sh);
}

// =====================================================
// DRAW: GROUND, ROAD AND LANE MARKINGS
// =====================================================
function groundPoly(f, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(W / 2 - f(0), HORIZON);
  ctx.lineTo(W / 2 + f(0), HORIZON);
  ctx.lineTo(W / 2 + f(SB), H);
  ctx.lineTo(W / 2 - f(SB), H);
  ctx.closePath();
  ctx.fill();
}

// Lane markings are painted on the road for good.
// We work out which parts of the road are "painted" and slide that pattern toward the
// player, so paint grows out of the horizon and never pops into existence.
function drawLaneMarks() {
  const P = 0.2, L = 0.115;                 // length of one dash + gap, and of the dash alone (long, slow dashes = no flicker, no rushing)
  const off = game.markPos % P;
  ctx.fillStyle = rgb(PAL.lane);
  for (const lx of [-0.5, 0.5]) {
    for (let k = -1; k * P + off < SB; k++) {
      let s0 = k * P + off, s1 = s0 + L;
      if (s1 <= 0) continue;
      if (s0 < 0) s0 = 0;
      if (s1 > SB) s1 = SB;
      const y0 = Math.floor(groundY(s0)), y1 = Math.ceil(groundY(s1));
      for (let y = y0; y < y1; y += 2) {            // chunky pixel rows
        const s = (y - HORIZON) / (BOTTOM - HORIZON);
        const half = 0.5 + 3.2 * s;
        const xc = W / 2 + lx * 130 * s;
        ctx.fillRect(Math.round(xc - half), y, Math.max(1, Math.round(half * 2)), 2);
      }
    }
  }
}

function drawGround() {
  // outside the sidewalks: dark ground, water, or lawn (depends on the district)
  ctx.fillStyle = rgb(PAL.outer);
  ctx.fillRect(0, HORIZON, W, H - HORIZON);

  // moving ripples on the water
  if (PAL.water > 0.05) {
    ctx.fillStyle = 'rgba(160,200,255,' + (0.22 * PAL.water).toFixed(3) + ')';
    for (let j = 0; j < 14; j++) {
      const f = ((j / 14) + game.roadPos * 0.25) % 1;
      const s = f * SB;
      const y = groundY(s);
      const room = W / 2 - sideHalf(s);
      if (room < 12) continue;
      const len = 6 + 16 * s;
      ctx.fillRect(room * (0.1 + 0.5 * ((j * 7) % 5) / 5), y, len, Math.max(1, 2 * s));
      ctx.fillRect(room * (0.55 + 0.35 * ((j * 3) % 4) / 4), y + 3 * s, len * 0.7, Math.max(1, 2 * s));
    }
  }

  groundPoly(sideHalf, rgb(PAL.walk));       // sidewalk

  const rg = ctx.createLinearGradient(0, HORIZON, 0, H);
  rg.addColorStop(0, rgb(PAL.roadA));
  rg.addColorStop(0.5, rgb(PAL.roadB));
  rg.addColorStop(1, rgb(PAL.roadC));
  groundPoly(roadHalf, rg);                  // road

  // sidewalk tile lines (a pattern that scrolls toward you)
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const P1 = 0.09, o1 = game.sidePos % P1;
  for (let k = 0; k * P1 + o1 < SB; k++) {
    const s = k * P1 + o1;
    if (s < 0.02) continue;
    const y = groundY(s);
    ctx.moveTo(W / 2 - sideHalf(s), y); ctx.lineTo(W / 2 - roadHalf(s), y);
    ctx.moveTo(W / 2 + roadHalf(s), y); ctx.lineTo(W / 2 + sideHalf(s), y);
  }
  ctx.stroke();

  // faint seams across the road (also scrolling)
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const P2 = 0.23, o2 = game.markPos % P2;
  for (let k = 0; k * P2 + o2 < SB; k++) {
    const s = k * P2 + o2;
    if (s < 0.02) continue;
    const y = groundY(s);
    ctx.moveTo(W / 2 - roadHalf(s), y); ctx.lineTo(W / 2 + roadHalf(s), y);
  }
  ctx.stroke();

  // curbs
  ctx.strokeStyle = rgb(PAL.edge);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W / 2 - roadHalf(0), HORIZON); ctx.lineTo(W / 2 - roadHalf(SB), H);
  ctx.moveTo(W / 2 + roadHalf(0), HORIZON); ctx.lineTo(W / 2 + roadHalf(SB), H);
  ctx.stroke();

  // solid painted edge lines
  ctx.strokeStyle = rgba(PAL.lane, 0.45);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - roadHalf(0) + 1, HORIZON);  ctx.lineTo(W / 2 - roadHalf(SB) + 6 * SB, H);
  ctx.moveTo(W / 2 + roadHalf(0) - 1, HORIZON);  ctx.lineTo(W / 2 + roadHalf(SB) - 6 * SB, H);
  ctx.stroke();

  drawLaneMarks();

  // railing along the water (fades in with the waterfront)
  if (PAL.water > 0.05) {
    const a = PAL.water;
    ctx.strokeStyle = 'rgba(200,190,240,' + (0.8 * a).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2 - sideHalf(0), HORIZON);
    ctx.lineTo(W / 2 - sideHalf(SB), H - 14 * SB);
    ctx.moveTo(W / 2 - sideHalf(0), HORIZON);
    ctx.lineTo(W / 2 - sideHalf(SB), H);
    ctx.stroke();
    ctx.fillStyle = 'rgba(200,190,240,' + (0.7 * a).toFixed(3) + ')';
    const P3 = 0.07, o3 = game.sidePos % P3;
    for (let k = 0; k * P3 + o3 < SB; k++) {
      const s = k * P3 + o3;
      if (s < 0.03) continue;
      ctx.fillRect(W / 2 - sideHalf(s) - 1, groundY(s) - 14 * s, Math.max(1, 2.2 * s), 14 * s);
    }
  }
}

// the mansion appears on the horizon in the last 750 meters (the whole final stretch)
function drawMansion() {
  const left = metersLeft();
  if (left > 750) return;
  const k = 1 - left / 750;          // 0 = just appeared, 1 = arrived
  const w = 30 + 110 * k;
  const h = w * 22 / 32;
  const x = W / 2;
  const y = HORIZON + 4;
  glowAt('warm', x, y - h * 0.5, w * 1.8, 0.35 + 0.25 * k);
  blit(SPR.mansion, x - w / 2, y - h, w, h);
}

// =====================================================
// DRAW: STREET SCENERY
// =====================================================
function drawBuilding(p) {
  const s = p.s;
  const img = SPR.bz[p.zi][p.variant];
  const k = 6 * s;                            // size of one sprite pixel on screen
  const w = img.width * k, h = img.height * k;
  const inner = sideHalf(s);
  const x = p.side < 0 ? W / 2 - inner - w : W / 2 + inner;
  if (x > W || x + w < 0) return;             // off screen, skip
  const gy = groundY(s);
  blit(img, x, gy - h, w, h, p.side > 0);
  const gl = ZONES[p.zi].glow;
  if (s > 0.12 && gl > 0.05) {                // glowing, sometimes flickering, shop signs
    glowAt(img.gl, x + w / 2, gy - img.gb * k, w * 1.1, 0.34 * gl * flick(p.phase));
  }
}

// how each kind of street object is placed:
// base = size of one sprite pixel at s=1, pole = which sprite column sits on the spot, off = distance from the road edge
const FD = {
  lamp:      { base: 5.5, pole: 5,  off: 14, asym: true },
  tlight:    { base: 5.5, pole: 2,  off: 14, asym: true },
  subway:    { base: 3.4, pole: 11, off: 40 },
  car:       { base: 3,   pole: 12, off: 24 },
  ped:       { base: 5.5, pole: 4,  off: 32 },
  npc:       { base: 5.5, pole: 5,  off: 34, asym: true },
  group:     { base: 4.8, pole: 13, off: 42 },
  trash:     { base: 5,   pole: 4,  off: 14 },
  hydrant:   { base: 5,   pole: 3,  off: 10 },
  bench:     { base: 4.5, pole: 7,  off: 30 },
  news:      { base: 4.8, pole: 5,  off: 36 },
  busstop:   { base: 4,   pole: 11, off: 40 },
  cones:     { base: 4.5, pole: 7,  off: 30 },
  scaffold:  { base: 5,   pole: 9,  off: 36 },
  tree:      { base: 5,   pole: 9,  off: 30 },
  hedge:     { base: 4.5, pole: 11, off: 22 },
  gate:      { base: 5.5, pole: 4,  off: 8 },
  statue:    { base: 5,   pole: 5,  off: 40 },
  crane:     { base: 5,   pole: 12, off: 70 },
  containers:{ base: 4.2, pole: 11, off: 56 },
  boat:      { base: 4.2, pole: 9,  off: 70 },
  cart:      { base: 5,   pole: 7,  off: 34 },
  sandboard: { base: 5,   pole: 4,  off: 26 },
  bollard:   { base: 5,   pole: 2,  off: 8 },
  vent:      { base: 5,   pole: 5,  off: 30 }
};

function spriteFor(p) {
  switch (p.kind) {
    case 'lamp': return SPR.lamp;
    case 'tlight': return SPR.tlights[p.variant];
    case 'subway': return SPR.subway;
    case 'car': return SPR.parked[p.variant];
    case 'ped': return SPR.peds[p.variant];
    case 'npc': return SPR.npcs[p.variant];
    case 'group': return SPR.groups[p.variant];
    case 'trash': return SPR.trash;
    case 'hydrant': return SPR.hydrant;
    case 'bench': return SPR.bench;
    case 'news': return SPR.news;
    case 'busstop': return SPR.busstop;
    case 'cones': return SPR.cones;
    case 'scaffold': return SPR.scaffold;
    case 'tree': return SPR.trees[p.variant];
    case 'hedge': return SPR.hedge;
    case 'gate': return SPR.gate;
    case 'statue': return SPR.statue;
    case 'crane': return SPR.crane;
    case 'containers': return SPR.containers;
    case 'boat': return SPR.boats[p.variant];
    case 'cart': return SPR.cart;
    case 'sandboard': return SPR.sandboard;
    case 'bollard': return SPR.bollard;
    default: return SPR.vent;
  }
}

function steamAt(x, y, s, phase, n) {
  for (let i = 0; i < n; i++) {
    const ph = (game.time * 0.6 + i / n + phase) % 1;
    const sz = Math.max(1, (3 + ph * 8) * s * 1.6);
    ctx.fillStyle = 'rgba(220,210,255,' + ((1 - ph) * 0.4).toFixed(2) + ')';
    ctx.fillRect(x + Math.sin(ph * 6 + i * 2) * 4 * s - sz / 2, y - ph * 46 * s, sz, sz);
  }
}

function drawDock(p) {
  const s = p.s, gy = groundY(s);
  const xe = W / 2 - sideHalf(s);
  const len = 110 * s, th = 6 * s;
  if (xe < 4) return;
  ctx.fillStyle = '#7a5530';
  ctx.fillRect(xe - len, gy - th, len, th);
  ctx.fillStyle = '#9a6a3a';
  ctx.fillRect(xe - len, gy - th, len, Math.max(1, 2 * s));
  ctx.fillStyle = '#4a3018';
  for (let i = 1; i < 7; i++) ctx.fillRect(xe - len + i * len / 7, gy - th, Math.max(1, s), th);
  ctx.fillStyle = '#3a2410';
  ctx.fillRect(xe - len, gy - th, Math.max(2, 4 * s), 12 * s);
  ctx.fillRect(xe - len / 2, gy - th, Math.max(2, 4 * s), 10 * s);
}

function drawFurniture(p) {
  if (p.kind === 'dock') { drawDock(p); return; }
  const s = p.s;
  const spec = FD[p.kind];
  const img = spriteFor(p);
  const rh = roadHalf(s);
  const gy = groundY(s);

  const flip = spec.asym && p.side > 0;               // lamps and traffic lights face the road
  const k = spec.base * s;
  const w = img.width * k, h = img.height * k;
  let off = spec.off;
  if (p.kind === 'boat') off += p.variant * 55;       // boats float further out on the water
  const ax = W / 2 + p.side * (rh + off * s);
  const x = flip ? ax + spec.pole * k - w : ax - spec.pole * k;
  let y = gy - h;
  if (p.kind === 'ped') y -= Math.abs(Math.sin(game.time * 8 + p.phase)) * 2 * s;   // walking bounce
  else if (p.kind === 'npc') {
    const ps = img.pose;
    if (ps === 'watch') y -= Math.abs(Math.sin(game.time * 6 + p.phase)) * 3 * s;       // cheering hops
    else if (ps === 'walk') y -= Math.abs(Math.sin(game.time * 8 + p.phase)) * 2 * s;
    else if (ps === 'juice') y -= Math.abs(Math.sin(game.time * 3 + p.phase)) * 1 * s;
  } else if (p.kind === 'group') y -= Math.abs(Math.sin(game.time * 5 + p.phase)) * 1.5 * s;
  if (p.kind === 'boat') y += Math.sin(game.time * 2 + p.phase) * 2 * s + 4 * s;    // bobbing on the waves
  if (x > W || x + w < 0) return;

  // little shadow
  if (p.kind !== 'boat') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(ax - w * 0.3, gy - 2 * s, w * 0.6, 4 * s);
  }

  blit(img, x, y, w, h, flip);
  if (p.kind === 'npc' && img.pose === 'juice' && s > 0.22) glowAt('warm', flip ? x + 2 * k : x + w - 2.5 * k, y + 7 * k, 12 * s + 6, 0.5);   // apple juice carton glow
  if (p.kind === 'npc' && img.pose === 'phone' && s > 0.3) glowAt('ice', flip ? x + 1.5 * k : x + w - 1.5 * k, y + 6.5 * k, 16 * s + 6, 0.55);   // glowing phone screen

  // lights and effects
  if (p.kind === 'lamp') {
    const gx = flip ? x + w - 8 * k : x + 8 * k;
    const gyy = y + 7 * k;
    glowAt('warm', gx, gyy, 110 * s, 0.7);
    ctx.fillStyle = 'rgba(255,230,150,0.12)';
    ctx.beginPath();
    ctx.ellipse(gx, gy - 4 * s, Math.max(0.1, 45 * s), Math.max(0.1, 10 * s), 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (p.kind === 'tlight') {
    const fx = flip ? x + w - 11.5 * k : x + 11.5 * k;
    if (p.variant === 0) glowAt('red', fx, y + 10.5 * k, 45 * s, 0.8);
    else glowAt('green', fx, y + 18.5 * k, 45 * s, 0.8);
  } else if (p.kind === 'subway') {
    glowAt('green', x + 2 * k, y + 2 * k, 45 * s, 0.7);
    glowAt('green', x + 20 * k, y + 2 * k, 45 * s, 0.7);
  } else if (p.kind === 'car' && p.variant === POLICE_INDEX) {
    if (Math.floor(game.time * 6) % 2 === 0) glowAt('red', x + 9 * k, y + k, 55 * s, 0.9);
    else glowAt('blue', x + 15 * k, y + k, 55 * s, 0.9);
  } else if (p.kind === 'crane') {
    if (Math.floor(game.time * 1.5) % 2 === 0) glowAt('red', x + 11.5 * k, y + 2.5 * k, 40 * s, 0.9);
  } else if (p.kind === 'busstop') {
    glowAt('pink', x + 17.5 * k, y + 10 * k, 60 * s, 0.45);
  } else if (p.kind === 'cart') {
    glowAt('warm', x + 7 * k, y + 6 * k, 70 * s, 0.5);
    steamAt(x + 7 * k, y + 2 * k, s, p.phase, 3);
  } else if (p.kind === 'vent') {
    steamAt(x + 5 * k, y + 2 * k, s, p.phase, 4);
  } else if (p.kind === 'sandboard') {
    glowAt('pink', x + 4 * k, y + 5 * k, 40 * s, 0.35 * flick(p.phase));
  } else if (p.kind === 'gate') {
    glowAt('warm', x + 4 * k, y + 2 * k, 70 * s, 0.8);
  }
}

// cross traffic: cars driving along the street at the next intersection (far away only)
function drawCross(p) {
  const s = p.s;
  const img = SPR.sideCars[p.variant];
  const k = 3.2 * s;
  const w = img.width * k, h = img.height * k;
  const x = W / 2 + p.u * roadHalf(s);
  const y = groundY(s);
  ctx.globalAlpha = clamp((0.6 - s) * 4, 0, 0.9);
  blit(img, x - w / 2, y - h, w, h, p.dir < 0);
  ctx.globalAlpha = 1;
  glowAt('white', x + p.dir * w * 0.52, y - h * 0.4, 36 * s, 0.6);      // headlights
  glowAt('red', x - p.dir * w * 0.5, y - h * 0.4, 18 * s, 0.4);
}

// strings of hanging lanterns or party lights across the street
function drawString(p) {
  const s = p.s;
  if (s < 0.06) return;
  const xl = W / 2 - sideHalf(s) + 6 * s, xr = W / 2 + sideHalf(s) - 6 * s;
  const y0 = groundY(s) - 150 * s;
  const sag = 16 * s;
  const a = clamp(s * 5, 0, 1);
  ctx.globalAlpha = a;
  ctx.strokeStyle = '#1a0f22';
  ctx.lineWidth = Math.max(1, 1.4 * s);
  ctx.beginPath();
  for (let i = 0; i <= 12; i++) {
    const u = i / 12;
    const x = xl + (xr - xl) * u, y = y0 + sag * Math.sin(u * Math.PI);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  for (let i = 1; i < 12; i += 2) {
    const u = i / 12;
    const x = xl + (xr - xl) * u, y = y0 + sag * Math.sin(u * Math.PI);
    const sz = Math.max(2, 7 * s);
    if (p.variant === 0) {                       // red paper lanterns
      ctx.fillStyle = '#e0302a';
      ctx.fillRect(x - sz / 2, y, sz, sz * 1.2);
      ctx.fillStyle = '#ffd400';
      ctx.fillRect(x - sz / 4, y - sz * 0.3, sz / 2, sz * 0.3);
      ctx.fillRect(x - sz / 4, y + sz * 1.2, sz / 2, sz * 0.4);
      if (s > 0.25) glowAt('red', x, y + sz * 0.6, sz * 4, 0.45);
    } else {                                     // bright party bulbs
      const c = (i + Math.floor(game.time * 2)) % 3;
      ctx.fillStyle = c === 0 ? '#ff4fd8' : (c === 1 ? '#4dffe0' : '#ffd400');
      ctx.fillRect(x - sz / 3, y, sz * 0.66, sz * 0.8);
      if (s > 0.25) glowAt(c === 0 ? 'pink' : (c === 1 ? 'cyan' : 'warm'), x, y + sz * 0.4, sz * 4, 0.5);
    }
  }
  ctx.globalAlpha = 1;
}

// flat things painted on the road: manholes and crosswalks
function drawFlat() {
  // red lane strip under every van that is coming toward you
  for (let i = 0; i < game.obstacles.length; i++) {
    const ob = game.obstacles[i];
    if (ob.type !== 'van' || ob.s > 0.95) continue;
    const a = Math.max(0.02, ob.s);
    const pulse = 0.5 + 0.5 * Math.sin(game.time * 14);
    const vl = ob.lx !== undefined ? ob.lx : ob.lane;
    const xa = laneX(vl, a), xb = laneX(vl, 1);
    const ya = groundY(a), yb = groundY(1);
    ctx.fillStyle = 'rgba(255,40,60,' + (0.10 + 0.14 * pulse).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(xa - 58 * a, ya); ctx.lineTo(xa + 58 * a, ya);
    ctx.lineTo(xb + 58, yb); ctx.lineTo(xb - 58, yb);
    ctx.closePath();
    ctx.fill();
  }
  const list = game.scenery;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (!p.flat || p.s < 0.03) continue;
    const s = p.s;
    if (p.kind === 'manhole') {
      const x = laneX(p.lane, s), y = groundY(s);
      ctx.fillStyle = '#0a0812';
      ctx.fillRect(x - 17 * s, y - 5 * s, 34 * s, 10 * s);
      ctx.fillStyle = '#4a4468';
      ctx.fillRect(x - 15 * s, y - 4 * s, 30 * s, Math.max(1, 3 * s));
      ctx.fillStyle = '#1c1830';
      ctx.fillRect(x - 15 * s, y - 1 * s, 30 * s, 4 * s);
      for (let j = -2; j <= 2; j++) ctx.fillRect(x + j * 5 * s, y - 4 * s, Math.max(1, s), 7 * s);
      if (s > 0.12) steamAt(x, y, s * 1.2, p.phase, 5);
    } else {                               // crosswalk
      const s0 = s, s1 = s + 0.05;
      if (groundY(s0) > H + 20) continue;
      ctx.fillStyle = 'rgba(240,235,255,0.5)';
      for (let j = -4; j <= 4; j++) {
        const u0 = (j - 0.3) / 4.6, u1 = (j + 0.3) / 4.6;
        ctx.beginPath();
        ctx.moveTo(W / 2 + u0 * roadHalf(s0), groundY(s0));
        ctx.lineTo(W / 2 + u1 * roadHalf(s0), groundY(s0));
        ctx.lineTo(W / 2 + u1 * roadHalf(s1), groundY(s1));
        ctx.lineTo(W / 2 + u0 * roadHalf(s1), groundY(s1));
        ctx.fill();
      }
    }
  }
}

function drawObstacle(ob) {
  const s = ob.s;
  const x = laneX(ob.lx !== undefined ? ob.lx : ob.lane, s);
  const y = groundY(s);
  const w = 90 * s;

  // shadow on the road
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x - w / 2 - 3 * s, y - 4 * s, w + 6 * s, 8 * s);

  if (ob.type === 'van') {              // paparazzi van, facing you
    const img = SPR.pvans[ob.variant];
    const vw = 104 * s;
    const vh = vw * img.height / img.width;
    glowAt('warm', x, y - vh * 0.1, 150 * s, 0.3);                       // light spilling on the road
    blit(img, x - vw / 2, y - vh, vw, vh);
    glowAt('warm', x - 0.36 * vw, y - vh * 0.2, 46 * s, 0.85);          // headlights
    glowAt('warm', x + 0.36 * vw, y - vh * 0.2, 46 * s, 0.85);
    if (s > 0.35 && s < 1.0) {                                            // camera flashes
      const f = Math.floor(game.time * 8 + ob.phase * 3) % 6;
      if (f === 0) {
        glowAt('white', x + 0.4 * vw, y - vh * 0.88, 110 * s, 1);
        if (s > 0.6 && game.camFlash <= 0 && !game.paused && Math.random() < 0.25) { game.camFlash = 0.14; sfx('camera'); }
      }
    }
  } else if (ob.type === 'block') {            // cars, vans, buses (change lanes)
    const meta = SPR.obBlock[ob.variant];
    const h = w * meta.img.height / meta.img.width;
    blit(meta.img, x - w / 2, y - h, w, h);
    const ty = y - h + h * meta.ty;
    if (!PARKED_CAR[ob.variant]) {
      glowAt('red', x - 0.4 * w, ty, 24 * s, 0.7);
      glowAt('red', x + 0.4 * w, ty, 24 * s, 0.7);
    }
    if (meta.police) {
      if (Math.floor(game.time * 6) % 2 === 0) glowAt('red', x - 0.17 * w, y - h, 60 * s, 0.9);
      else glowAt('blue', x + 0.17 * w, y - h, 60 * s, 0.9);
    }
  } else if (ob.type === 'low') {       // barrier, cones, trash cans, boxes (jump)
    const img = SPR.obLow[ob.variant];
    const h = w * img.height / img.width;
    blit(img, x - w / 2, y - h, w, h);
    if (ob.variant === 0 && Math.floor(game.time * 5) % 2 === 0) {     // blinking warning light
      glowAt('amber', x - w * 0.38, y - h - 2 * s, 30 * s, 0.9);
    }
  } else {                              // overhead bars and banners (slide)
    const img = SPR.obHigh[ob.variant];
    const h = w * img.height / img.width;
    blit(img, x - w / 2, y - h, w, h);
    if (ob.variant === 2) {
      glowAt('violet', x, y - h + 3 * s, w * 0.8, 0.4);
    } else if (Math.floor(game.time * 4) % 2 === 0) {
      const gc = ob.variant === 0 ? 'red' : 'amber';
      glowAt(gc, x - w * 0.4, y - h + 3 * s, 26 * s, 0.8);
      glowAt(gc, x + w * 0.4, y - h + 3 * s, 26 * s, 0.8);
    }
  }
}

// draws one collectible
function drawPick(p) {
  const s = p.s;
  const x = laneX(p.lx !== undefined ? p.lx : p.lane, s);
  const gy = groundY(s);
  const bob = Math.sin(game.time * 6 + p.phase) * 4 * s;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x - 11 * s, gy - 2 * s, 22 * s, 4 * s);
  if (p.type === 'coin') {
    const cy = gy - 38 * s + bob;
    const spin = 0.25 + 0.75 * Math.abs(Math.cos(game.time * 4 + p.phase));
    const k = 3.4 * s;
    glowAt('warm', x, cy, 70 * s, 0.6);
    blit(SPR.coin, x - 5 * k * spin, cy - 5 * k, 10 * k * spin, 10 * k);
  } else if (p.type === 'pwr') {
    const img = SPR.pwr[p.kind];
    const cy = gy - 46 * s + bob;
    const k = 4 * s;
    glowAt(p.kind === 'magnet' ? 'pink' : (p.kind === 'shield' ? 'blue' : 'warm'), x, cy, 110 * s, 0.7);
    blit(img, x - img.width * k / 2, cy - img.height * k / 2, img.width * k, img.height * k);
  } else {
    const cy = gy - 44 * s + bob;
    const k = 3.2 * s;
    glowAt('amber', x, cy, 85 * s, 0.6);
    blit(SPR.juice, x - 5 * k, cy - 7 * k, 10 * k, 14 * k);
  }
}

function drawItem(it) {
  const s = it.s;
  const u = s;
  const x = laneX(it.lane, s);
  const gy = groundY(s);
  const bob = Math.sin(game.time * 6 + it.phase) * 4 * u;   // floats up and down
  const cy = gy - 42 * u + bob;
  const img = SPR.items[it.type];
  const k = 3 * u;
  const spin = 0.55 + 0.45 * Math.abs(Math.cos(game.time * 3 + it.phase));   // coin-style spin
  const w = img.width * k * spin, h = img.height * k;

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x - 12 * u, gy - 2 * u, 24 * u, 4 * u);

  glowAt(ITEM_GLOW[it.type], x, cy, 75 * u, 0.55);
  blit(img, x - w / 2, cy - h / 2, w, h);
}

// draws the target with his pixel-art sprite
// screen-space pixel text, drawn bold (used for the stencilled prison lettering on the jumpsuit back)
function fillPx(text, x, y, p, color) {
  ctx.fillStyle = color;
  const bw = Math.max(1, Math.round(p * (p > 2.5 ? 1.1 : 1.45))), bh = Math.max(1, Math.round(p * (p > 2.5 ? 1.05 : 1.15)));
  for (let i = 0; i < text.length; i++) {
    const g = FONT[text[i]];
    if (g) {
      for (let q = 0; q < 15; q++) {
        if (g.charAt(q) === '1') {
          const gx = Math.round(x + ((q % 3) + i * 4) * p), gy = Math.round(y + Math.floor(q / 3) * p);
          ctx.fillRect(gx, gy, bw, bh);
        }
      }
    }
  }
}
function drawBackPrint(x, top, k) {
  // top = y of the torso's first sprite row; the torso is 10 sprite pixels wide
  const p1 = 9.2 * k / 31;                     // "PRISONER" is 31 units wide
  const p2 = 0.95 * k;                         // "67" is 7 units wide, drawn big
  const ink = '#140700', paper = '#ffe2a8';
  const y1 = top + 0.8 * k, h1 = 5.6 * p1 + 0.8 * k;
  const y2 = y1 + h1 + 0.5 * k, h2 = 5 * p2 + 0.8 * k;
  ctx.fillStyle = paper;                        // pale stencil panel so the letters pop
  ctx.fillRect(Math.round(x - 4.9 * k), Math.round(y1), Math.round(9.8 * k), Math.round(h1));
  ctx.fillRect(Math.round(x - 3.4 * p2 - 0.4 * k), Math.round(y2), Math.round(7 * p2 + 0.8 * k), Math.round(h2));
  fillPx('PRISONER', x - 31 * p1 / 2, y1 + 0.4 * k, p1, ink);
  fillPx('67', x - 7 * p2 / 2, y2 + 0.4 * k, p2, ink);
}

function drawTarget() {
  const t = game.target;
  const s = t.s;
  const x = laneX(t.displayLane, s);
  const y = groundY(s);
  const u = s * 1.5;
  const step = game.over ? true : Math.sin(game.time * 14) > 0;
  const frame = step ? 0 : 1;
  const k = 4 * u;                       // size of one sprite pixel
  const w = 16 * k, h = 24 * k;

  // soft orange glow so he is easy to spot, plus a shadow
  glowAt('amber', x, y - h * 0.5, h * 1.6, 0.28);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x - 24 * u, y - 3 * u, 48 * u, 6 * u);

  const hopY = t.hop > 0 ? Math.abs(Math.sin(game.time * 18)) * 9 * u * Math.min(1, t.hop * 3) : 0;
  if (t.looking > 0) {
    blit(SPR.target.front[frame], x - w / 2, y - h - hopY, w, h);
  } else {
    blit(SPR.target.back[frame], x - w / 2, y - h - hopY, w, h);
    drawBackPrint(x, y - h - hopY + 7 * k, k);
  }
  if (t.bubT > 0 && t.bubble) {                                      // little speech bubble: YUM! / WHOA! / HA HA HA!
    const bw = t.bubble.width * k * 0.55, bh = t.bubble.height * k * 0.55;
    blit(t.bubble, x - bw / 2 + 3 * k, y - h - hopY - bh - 2 * k, bw, bh);
  } else if (t.looking > 0) {
    blit(SPR.bubble, x + 4 * k, y - h - hopY - 6 * k, 8 * k, 9 * k);     // "!" bubble
  }
}

function drawPlayer() {
  // flicker while invincible after a crash
  if (game.invincible > 0 && Math.floor(game.invincible * 12) % 2 === 0) return;

  const x = laneX(game.displayLane, 1);
  const sliding = game.slideTime > 0;
  const airborne = game.jumpY > 0;

  const sh = Math.max(0.4, 1 - game.jumpY / 200);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x - 26 * sh, BOTTOM - 3, 52 * sh, 6);

  if (game.shield) {                                         // shield bubble
    const pulse = 0.6 + 0.4 * Math.sin(game.time * 6);
    ctx.fillStyle = 'rgba(80,170,255,' + (0.12 * pulse).toFixed(3) + ')';
    ctx.strokeStyle = 'rgba(140,210,255,' + (0.5 + 0.4 * pulse).toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x, BOTTOM - 50 - game.jumpY, 40, 58, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  const cs = SPR.chars[selIdx()];
  if (sliding) {
    blit(cs.slide, x - 32, BOTTOM - 40 - game.jumpY, 64, 40);
  } else {
    const frame = airborne ? 2 : (Math.floor(game.time * 10) % 2);
    const bob = (airborne || frame === 0) ? 0 : -2;
    blit(cs.run[frame], x - 32, BOTTOM - 96 - game.jumpY + bob, 64, 96);
  }
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  ctx.textAlign = 'center';
  for (const f of game.floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = 'bold ' + f.size + 'px monospace';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#000';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// distance fog: hides things popping in at the horizon
function drawFog() {
  const g = ctx.createLinearGradient(0, HORIZON, 0, HORIZON + 90);
  g.addColorStop(0, rgba(PAL.fog, 0.55));
  g.addColorStop(1, rgba(PAL.fog, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, HORIZON, W, 90);
}

// floating dust, embers, mist... (colour follows the district)
function drawAtmosphere() {
  ctx.fillStyle = rgb(PAL.haze);
  const sh = game.displayLane - 1;
  for (let i = 0; i < MOTES.length; i++) {
    const m = MOTES[i];
    const y = 130 + (((m.y - game.time * m.sp) % 490) + 490) % 490;
    const x = (((m.x + Math.sin(game.time * 0.6 + m.ph) * 14 - sh * 10) % W) + W) % W;
    ctx.globalAlpha = 0.18 + 0.22 * Math.abs(Math.sin(game.time + m.ph));
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
}

// stronger effects as the mansion gets close
function drawIntensityFX() {
  const it = Math.max(game.intensity, game.meter >= 80 && !game.over ? 0.55 : 0);
  if (it <= 0.02) return;
  ctx.globalAlpha = it * 0.5 * (0.6 + 0.4 * Math.sin(game.time * 7));
  ctx.drawImage(SPR.alert, 0, 0);
  ctx.globalAlpha = 1;
  if (game.paused) return;
  // speed streaks near the screen edges
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const n = 4 + Math.floor(it * 10);
  for (let i = 0; i < n; i++) {
    const left = Math.random() < 0.5;
    const x = left ? Math.random() * 60 : W - Math.random() * 60;
    const y = 140 + Math.random() * 480;
    ctx.moveTo(x, y);
    ctx.lineTo(x + (left ? 1 : -1) * 6, y + 30 + Math.random() * 50);
  }
  ctx.stroke();
}
