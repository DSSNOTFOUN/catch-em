const PAUSE_BTN = { x: 358, y: 44, w: 34, h: 28 };
function drawMeter() {
  const x0 = 50, y0 = 52, segW = 30, segH = 16;

  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'left';
  outlineText('CATCH METER', x0, 46, '#ffffff', 3);
  ctx.textAlign = 'right';
  outlineText(Math.floor(game.meter) + '%', x0 + 300, 46, '#ffffff', 3);

  ctx.fillStyle = '#0b0718';
  ctx.fillRect(x0 - 3, y0 - 3, 300 + 3, segH + 6);
  if (game.meter >= 80 && !game.over) {                       // the meter pulses when he's almost caught
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.45 * Math.abs(Math.sin(game.time * 9))).toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.strokeRect(x0 - 5, y0 - 5, 306, segH + 10);
  }

  let color = '#3a7bff';
  if (game.meter >= 40) color = '#ff4fd8';
  if (game.meter >= 75) color = (Math.floor(game.time * 8) % 2 === 0) ? '#ffd400' : '#ff2a4d';

  for (let i = 0; i < 10; i++) {
    const frac = Math.max(0, Math.min(1, (game.meter - i * 10) / 10));
    ctx.fillStyle = '#2a2150';
    ctx.fillRect(x0 + i * segW, y0, segW - 3, segH);
    ctx.fillStyle = color;
    ctx.fillRect(x0 + i * segW, y0, (segW - 3) * frac, segH);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(x0 + i * segW, y0, (segW - 3) * frac, 4);
  }
}

function drawHUD() {
  const left = metersLeft();

  ctx.fillStyle = hudGrad;
  ctx.fillRect(0, 0, W, 125);

  ctx.textAlign = 'center';
  ctx.font = 'bold 20px monospace';
  outlineText('DISTANCE TO THE PARTY: ' + left + 'M', W / 2, 28, '#ffd400', 5);

  drawMeter();

  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'left';
  outlineText('SCORE ' + game.score.toLocaleString(), 12, 96, '#ffffff', 4);
  ctx.textAlign = 'right';
  const goalReached = game.evidence >= EVIDENCE_GOAL;
  outlineText('EVIDENCE: ' + Math.min(game.evidence, EVIDENCE_GOAL) + '/' + EVIDENCE_GOAL,
              W - 12, 96, goalReached ? '#ffd400' : '#4dff88', 4);

  // CASE COINS counter (and the APPLE JUICE the target has grabbed)
  const cp = 1 + game.coinPop * 0.35;
  ctx.drawImage(SPR.coin, 12, 106, 14 * cp, 14 * cp);
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'left';
  outlineText('x' + game.coins, 32, 119, '#ffd400', 4);
  ctx.font = 'bold 11px monospace';
  outlineText('BANK ' + totalCoins, 78, 119, '#c8b070', 3);
  ctx.textAlign = 'right';
  ctx.font = 'bold 11px monospace';
  outlineText('JUICE ' + game.juice, W - 12, 119, '#ffd84a', 3);

  // active power-ups (small icon + time left)
  let py = 130;
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px monospace';
  if (game.magnetT > 0) { ctx.drawImage(SPR.pwr.magnet, 12, py, 16, 16); outlineText(Math.ceil(game.magnetT) + 's', 34, py + 13, '#ff8aa0', 3); py += 20; }
  if (game.boostT > 0)  { ctx.drawImage(SPR.pwr.boost, 12, py, 16, 16);  outlineText('x2 ' + Math.ceil(game.boostT) + 's', 34, py + 13, '#ffd400', 3); py += 20; }
  if (game.shield)      { ctx.drawImage(SPR.pwr.shield, 12, py, 15, 16); outlineText('SHIELD', 34, py + 13, '#7fc8ff', 3); py += 20; }

  // pause button (top right, under the distance text)
  if (!game.over) {
    const b = PAUSE_BTN;
    ctx.fillStyle = '#000000'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ff8a00'; ctx.lineWidth = 3; ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x + 10, b.y + 7, 5, 14); ctx.fillRect(b.x + 19, b.y + 7, 5, 14);
  }

  // distance milestone message
  if (!game.over && game.msT > 0) {
    ctx.globalAlpha = Math.min(1, game.msT * 2, (2.4 - game.msT) * 4);
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px monospace';
    outlineText(game.msText, W / 2, 322, '#ffd400', 5);
    ctx.globalAlpha = 1;
  }
  if (!game.over && game.maxT > 0) {
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(26 + 4 * Math.sin(game.time * 14)) + 'px monospace';
    outlineText('MAX COMBO!', W / 2, 232, '#ffd400', 6);
  }

  const flash = Math.floor(game.time * 4) % 2 === 0;
  if (!game.over && flash) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px monospace';
    if (left <= 100) {
      outlineText('GET HIM!', W / 2, 140, '#ff2a4d', 6);
    } else if (left <= 500) {
      outlineText("HE'S ALMOST THERE!", W / 2, 140, '#ff4fd8', 6);
    }
  }

  const mult = comboMult();
  if (!game.over && mult >= 2) {
    const size = 26 * (1 + game.comboPop * 0.4) * (mult >= 6 ? 1 + 0.1 * Math.sin(game.time * 10) : 1);
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + size + 'px monospace';
    outlineText('COMBO x' + mult, W / 2, 182,
                mult >= 6 ? '#ff2a4d' : (mult >= 4 ? '#ff4fd8' : '#ffd400'), 6);
  }

  if (game.hitFlash > 0 && !game.over) {
    ctx.fillStyle = 'rgba(255,0,60,' + (game.hitFlash / 0.25) * 0.35 + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

// the name of a new district slides in
function drawWarning() {
  if (game.over || game.warnT <= 0) return;
  const on = Math.floor(game.warnT * 6) % 2 === 0 || game.warnT > 1.2;
  if (!on) return;
  const a = Math.min(1, game.warnT * 3);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = 'bold 15px monospace';
  const tw = game.warnText.length * 9;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(W / 2 - tw / 2 - 34, 189, tw + 68, 28);
  ctx.fillStyle = '#ffd400';
  for (const sx of [W / 2 - tw / 2 - 20, W / 2 + tw / 2 + 20]) {   // little warning triangles
    ctx.beginPath(); ctx.moveTo(sx, 193); ctx.lineTo(sx + 9, 211); ctx.lineTo(sx - 9, 211); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#000'; ctx.fillRect(sx - 1, 198, 2, 7); ctx.fillRect(sx - 1, 207, 2, 2); ctx.fillStyle = '#ffd400';
  }
  outlineText(game.warnText, W / 2, 209, '#ffd400', 4);
  ctx.globalAlpha = 1;
}

function drawBanner() {
  if (game.over || game.bannerT <= 0 || game.zoneIdx < 0) return;
  const e = 3.2 - game.bannerT;
  const a = Math.min(1, e * 5, game.bannerT * 2);
  const slide = (1 - Math.min(1, e * 4)) * -W;                 // the band slides in from the left
  const col = rgb(PAL.haze);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(slide, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 238, W, 50);
  ctx.fillStyle = col;
  ctx.fillRect(0, 238, W, 3);
  ctx.fillRect(0, 285, W, 3);
  for (let i = 0; i < 10; i++) ctx.fillRect(i * 42 + ((game.time * 40) % 42), 244, 14, 2);    // moving pixel dashes
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px monospace';
  outlineText('NOW ENTERING', W / 2, 259, '#ffffff', 3);
  ctx.font = 'bold 21px monospace';
  outlineText(ZONES[game.zoneIdx].name, W / 2, 280, col, 5);
  ctx.restore();
}

function drawRecordBanner(y, size) {

}

function drawCaught(et) {

// ----- THE PARTY (when he gets away) -----
const BEAM_COLORS = ['255,79,216', '77,255,224', '255,230,120'];
const WIN_SPOTS = [[11, 9.5], [21, 9.5], [16, 9.5], [3, 16.5], [6, 16.5], [26, 16.5], [29, 16.5]];
const GLOW_CYCLE = ['pink', 'cyan', 'violet', 'warm'];

function ease(t) { return t * t * (3 - 2 * t); }
function carScale(y) { return 1.3 + (y - 400) / 300 * 3.2; }

function drawPartyScene(ts) {
  ctx.drawImage(SPR.pbg, 0, 0);

  const lit = clamp((ts - 2.0) / 0.9, 0, 1);       // house lights
  const party = clamp((ts - 2.8) / 0.8, 0, 1);     // party lights
  const beat = (ts * 2.2) % 1;

  // searchlights sweeping the sky (behind the house)
  if (party > 0) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const bx = 90 + i * 110, by = 330;
      const a = Math.sin(ts * 1.4 + i * 2.1) * 0.55;
      const tx = bx + Math.sin(a) * 620, ty = by - Math.cos(a) * 620;
      ctx.fillStyle = 'rgba(' + BEAM_COLORS[i] + ',' + (0.11 * party).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(bx - 8, by); ctx.lineTo(bx + 8, by);
      ctx.lineTo(tx + 55, ty); ctx.lineTo(tx - 55, ty);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // the mansion: dark first, then the lights come on
  ctx.drawImage(SPR.mansionDark, 24, 158, 352, 242);
  if (lit > 0) {
    const q = Math.ceil(lit * 5) / 5;               // lights switch on in steps
    ctx.globalAlpha = q * (ts < 2.9 ? 0.85 + 0.15 * Math.sin(ts * 40) : 1);
    ctx.drawImage(SPR.mansion, 24, 158, 352, 242);
    ctx.globalAlpha = 1;
    glowAt('warm', 200, 365, 170, 0.5 * q);
  }

  // party sign and coloured window glows
  if (party > 0) {
    const sa = 0.7 + 0.3 * (Math.sin(ts * 9) > -0.7 ? 1 : 0.3);
    glowAt('pink', 200, 118, 280, 0.6 * party * sa);
    ctx.globalAlpha = party * sa;
    const sw = SPR.partySign.width * 6.4;
    ctx.drawImage(SPR.partySign, 200 - sw / 2, 100, sw, 32);
    ctx.globalAlpha = 1;
    for (let i = 0; i < WIN_SPOTS.length; i++) {
      const name = GLOW_CYCLE[(Math.floor(ts * 3) + i) % 4];
      glowAt(name, 24 + WIN_SPOTS[i][0] * 11, 158 + WIN_SPOTS[i][1] * 11, 95, 0.55 * party);
    }
  }

  // moving neon spotlights sweeping the lawn, plus a laser fan from the sign
  if (party > 0) {
    for (let i = 0; i < 4; i++) {
      const lx = 200 + Math.sin(ts * (0.9 + i * 0.3) + i * 1.7) * 170;
      const ly = 540 + Math.cos(ts * (0.7 + i * 0.25) + i * 2.3) * 90;
      glowAt(GLOW_CYCLE[(i + Math.floor(ts * 1.5)) % 4], lx, ly, 130, 0.38 * party);
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = Math.sin(ts * 1.1 + i * 0.9) * 1.1 + (i - 2.5) * 0.35;
      ctx.strokeStyle = 'rgba(' + BEAM_COLORS[i % 3] + ',' + (0.35 * party).toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(200, 130);
      ctx.lineTo(200 + Math.sin(a) * 520, 130 + Math.cos(a) * 520);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // string lights across the lawn
  if (party > 0) {
    ctx.strokeStyle = 'rgba(10,6,20,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 20; i++) {
      const x = i * 20, y = 420 + 26 * Math.sin(Math.PI * i / 20);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    for (let i = 1; i < 20; i++) {
      const x = i * 20, y = 420 + 26 * Math.sin(Math.PI * i / 20);
      const c = (i + Math.floor(ts * 2.5)) % 4;
      ctx.fillStyle = c === 0 ? '#ff4fd8' : (c === 1 ? '#4dffe0' : (c === 2 ? '#ffd400' : '#b494ff'));
      ctx.globalAlpha = party;
      ctx.fillRect(x - 2, y, 4, 5);
      ctx.globalAlpha = 1;
    }
  }

  // balloons drifting up
  if (party > 0) {
    for (let i = 0; i < 9; i++) {
      const y = 700 - ((ts * 38 + i * 77) % 620);
      const x = 28 + i * 43 + Math.sin(ts * 1.5 + i) * 8;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y + 40); ctx.lineTo(x + 2, y + 70); ctx.stroke();
      if (i % 3 === 1) ctx.drawImage(SPR.carton, x - 13, y + 2, 26, 39);       // giant floating juice cartons
      else ctx.drawImage(SPR.balloons[i % 5], x - 15, y, 30, 40);
    }
    for (const bx of [58, 342]) {                                              // stacks of apple juice by the speakers
      for (let r2 = 0; r2 < 3; r2++) for (let c2 = 0; c2 <= 2 - r2; c2++) {
        ctx.drawImage(SPR.carton, bx - 33 + c2 * 22 + r2 * 11, 566 - r2 * 26, 20, 30);
      }
    }
  }

  // ----- the things that move: cars, people, and the target (sorted back to front) -----
  const q = PARTY.q;
  q.length = 0;

  for (let i = 0; i < PARTY.cars.length; i++) {
    const c = PARTY.cars[i];
    if (ts < c.t0) continue;
    const p = clamp((ts - c.t0) / 2.2, 0, 1);
    if (p < 0.45) {
      const e = ease(p / 0.45);
      c.dx = 200 + (c.i % 2 ? -28 : 28) * (1 - e);
      c.dy = lerp(790, 560, e);
      c.dk = lerp(5, 3.4, e);
    } else {
      const e = ease((p - 0.45) / 0.55);
      c.dx = lerp(200, c.sx, e);
      c.dy = lerp(560, c.sy, e);
      c.dk = carScale(c.dy);
    }
    q.push(c);
  }
  for (let i = 0; i < PARTY.crowd.length; i++) {
    const c = PARTY.crowd[i];
    if (ts < c.t0) continue;
    const p = clamp((ts - c.t0) / 1.5, 0, 1);
    const e = ease(p);
    c.dx = lerp(c.side < 0 ? -20 : 420, c.tx, e);
    c.dy = c.ty;
    c.dk = 1.9 + (c.ty - 430) / 230 * 2.7;
    c.flip = c.side > 0 ? p < 1 : p >= 1 && (i % 2 === 0);
    c.dancing = p >= 1;
    q.push(c);
  }
  PARTY.tgt.dy = 405;
  q.push(PARTY.tgt);
  q.sort(function (a, b) { return a.dy - b.dy; });

  for (let i = 0; i < q.length; i++) {
    const o = q[i];
    if (o.type === 'car') {
      const k = o.dk;
      blit(SPR.parked[o.variant], o.dx - 12 * k, o.dy - 18 * k, 24 * k, 18 * k);
      glowAt('red', o.dx - 9 * k, o.dy - 8 * k, 30, 0.5);
      glowAt('red', o.dx + 9 * k, o.dy - 8 * k, 30, 0.5);
    } else if (o.type === 'ppl') {
      const k = o.dk;
      const bob = o.dancing ? Math.abs(Math.sin(ts * 7 + o.ph)) * 4 * k : Math.abs(Math.sin(ts * 12 + o.ph)) * 1.5 * k;
      const sway = o.dancing ? Math.sin(ts * 7 + o.ph) * 2 : 0;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(o.dx - 4 * k, o.dy - 1, 8 * k, 3);
      blit(SPR.peds[o.variant], o.dx - 4 * k + sway, o.dy - 16 * k - bob, 8 * k, 16 * k, o.flip);
      blit(SPR.topHats[o.variant % 6], o.dx - 4 * k + sway, o.dy - 16 * k - bob - 7 * k, 8 * k, 9 * k);   // top hat (sits on the head, never over the body)
      if (o.variant % 2 === 0 || o.variant % 3 === 0) {                                                     // cheers! apple juice in hand
        const up = o.dancing ? Math.abs(Math.sin(ts * 7 + o.ph)) * 3 * k : 0;
        blit(SPR.carton, o.dx + (o.flip ? -7.5 : 3.5) * k + sway, o.dy - 12.5 * k - bob - up, 4 * k, 6 * k, o.flip);
      }
    } else {
      drawPartyTarget(ts);
    }
  }

  // speakers with pulsing rings
  if (party > 0) {
    for (const sx of [10, 330]) {
      const cx = sx + 30, cy = 640;
      ctx.strokeStyle = 'rgba(255,79,216,' + ((1 - beat) * 0.6).toFixed(2) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy + 15, 18 + beat * 34, 0, Math.PI * 2); ctx.stroke();
      const pz = 1 + (1 - beat) * 0.06;
      ctx.drawImage(SPR.speaker, cx - 30 * pz, 600 - (pz - 1) * 40, 60 * pz, 80 * pz);
    }
    // music notes floating up
    for (let i = 0; i < 10; i++) {
      const ph = (ts * 0.5 + i / 10) % 1;
      const x = (i % 2 ? 340 : 60) + Math.sin(ph * 8 + i) * 16;
      const y = 610 - ph * 300;
      ctx.globalAlpha = (1 - ph) * party;
      ctx.drawImage(SPR.notes[i % 4], x, y, 15, 24);
    }
    ctx.globalAlpha = 1;
    // confetti
    for (let i = 0; i < 90; i++) {
      const x = ((i * 53 + Math.sin(ts * 2 + i) * 18) % W + W) % W;
      const y = ((ts * (60 + (i % 5) * 14) + i * 41) % 760) - 30;
      ctx.fillStyle = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      ctx.globalAlpha = party * (Math.sin(ts * 9 + i) > -0.6 ? 1 : 0.45);
      if (i % 3 === 0) ctx.fillRect(x, y, 6, 2); else ctx.fillRect(x, y, 3 + (i % 2), 3 + (i % 2));
    }
    ctx.globalAlpha = 1;
  }
}

function drawPartyTarget(ts) {
  const T = PARTY.tgt;
  let x = 200, y = 405, k = 2.5, back = true, frame = 0, alpha = 1, shake = 0;
  if (ts < 2.0) {                                    // running up the driveway
    const p = ts / 2.0;
    y = lerp(740, 405, p);
    k = lerp(6.2, 2.5, p);
    x = 200 + Math.sin(p * 14) * 3;
    frame = Math.floor(ts * 8) % 2;
  } else if (ts < 3.4) {                             // catching his breath at the door
    y = 405 + Math.sin(ts * 10) * 1.2;
  } else if (ts < 5.8) {                             // turns around to look at the camera
    back = false;
    frame = Math.floor(ts * 3) % 2;
    if (ts > 3.9 && ts < 4.8) shake = Math.sin(ts * 40) * 2;     // laughing
  } else if (ts < 6.6) {                             // walks inside
    const p = (ts - 5.8) / 0.8;
    y = 405 - p * 10;
    k = 2.5 - p * 0.5;
    alpha = 1 - p;
  } else {
    alpha = 0;
  }
  if (alpha <= 0) {
    if (ts < 7.4) glowAt('warm', 200, 365, 220 * (1 - (ts - 6.6) / 0.8), 0.7);
    return;
  }
  const w = 16 * k, h = 24 * k;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x - 8 * k, y - 2, 16 * k, 4);
  ctx.globalAlpha = alpha;
  blit(back ? SPR.target.back[frame] : SPR.target.front[frame], x - w / 2 + shake, y - h, w, h);
  ctx.globalAlpha = 1;
  if (!back) {
    const bub = ts < 4.7 ? SPR.bubNice : SPR.bubHa;
    const bw = bub.width * 2.4, bh = bub.height * 2.4;
    if (ts > 3.7 && ts < 5.6) ctx.drawImage(bub, x + 14 - bw / 2, y - h - bh - 6, bw, bh);
    if (ts > 4.4 && ts < 4.9) {                      // sunglasses glint
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + 4 * k - 2, y - h + 3.2 * k, 4, 4);
      ctx.fillRect(x + 4 * k - 5, y - h + 3.2 * k + 1, 10, 2);
    }
  }
}

function drawPartyCard(tc, et) {
  // the scene fades to the same dark night colour as the Home Screen
  drawEndShade(Math.min(0.88, tc * 1.5));
  homeTitle('HE GOT AWAY...', W / 2, 84, 34, 1 + Math.max(0, 1 - tc * 4) * 1.6);
  ctx.fillStyle = '#ffd9a8'; ctx.fillRect(40, 94, 320, 2);

  const n = Math.max(0, Math.floor((tc - 0.6) * 26));
  const l1 = 'AND HE JUST THREW';
  const l2 = 'ANOTHER JUICE PARTY.';
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px monospace';
  if (n > 0) outlineText(l1.substring(0, n), W / 2, 120, '#ffffff', 5);
  if (n > l1.length) outlineText(l2.substring(0, n - l1.length), W / 2, 144, OR, 5);

  if (tc > 2.0) {
    drawRecordBanner(164, 15);
    drawResultCard(172, 490, true, 24);
    drawPixelCover(1 - clamp((tc - 2.0) / 0.35, 0, 1), 0, H);
  }
}

function drawEscaped(et) {
  if (et < T_SCENE) {
    // first: the dark night screen with "HE GOT AWAY!"
    drawEndShade(Math.min(0.9, et * 1.6));
    homeTitle('HE GOT AWAY!', W / 2, 300, 40, 1 + Math.max(0, 1 - et * 3) * 2.5);
    if (et > 0.5) {
      ctx.fillStyle = '#ffd9a8'; ctx.fillRect(60, 314, 280, 2);
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('So close... try again!', W / 2, 342);
    }
    if (et > T_TITLE) {                               // fade to black
      ctx.fillStyle = 'rgba(0,0,0,' + clamp((et - T_TITLE) / (T_SCENE - T_TITLE), 0, 1) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  } else {
    const ts = et - T_SCENE;
    drawPartyScene(ts);
    if (ts < 0.5) {                                   // fade in from black
      ctx.fillStyle = 'rgba(0,0,0,' + (1 - ts / 0.5) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (ts > 6.8 + PARTY_HOLD) drawPartyCard(ts - 6.8 - PARTY_HOLD, et);
  }
  if (et > 0.6 && et < T_FINAL) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('SPACE / TAP TO SKIP', W / 2, 692);
  }
}

function drawEndScreen() {
  if (!game.over) return;
  if (game.result === 'caught') drawCaught(game.endTimer);
  else drawEscaped(game.endTimer);
}

// =====================================================
// DRAW: EVERYTHING
// =====================================================
function draw() {
  ctx.imageSmoothingEnabled = false;

  // once the party scene is on screen we don't need to draw the street any more
  if (game.over && game.result === 'escaped' && game.endTimer >= T_SCENE) {
    ctx.fillStyle = '#0b0b1a';
    ctx.fillRect(0, 0, W, H);
    drawEndScreen();
    drawMenuBtn();
    drawSpeaker();
    if (SCANLINES) ctx.drawImage(SPR.scan, 0, 0);
    return;
  }

  // wipe the screen first (needed because of screen shake)
  ctx.fillStyle = '#0b0b1a';
  ctx.fillRect(0, 0, W, H);

  // the game world shakes, but the HUD text stays steady
  ctx.save();
  const shk = 0;                                  // no camera shake at all (comfort)
  if (shk > 0) ctx.translate((Math.random() - 0.5) * shk, (Math.random() - 0.5) * shk);

  drawBackground();
  drawGround();
  drawFlat();
  drawMansion();

  // everything standing on the street is drawn together, farthest first,
  // so things closer to you correctly cover things farther away.
  drawQ.length = 0;
  const sc = game.scenery;
  for (let i = 0; i < sc.length; i++) if (!sc[i].flat) drawQ.push(sc[i]);
  for (let i = 0; i < game.obstacles.length; i++) drawQ.push(game.obstacles[i]);
  for (let i = 0; i < game.items.length; i++) drawQ.push(game.items[i]);
  for (let i = 0; i < game.picks.length; i++) drawQ.push(game.picks[i]);
  drawQ.push(game.target);
  drawQ.sort(bySort);
  for (let i = 0; i < drawQ.length; i++) {
    const o = drawQ[i];
    if (o.cls === 'ob') drawObstacle(o);
    else if (o.cls === 'it') drawItem(o);
    else if (o.cls === 'pk') drawPick(o);
    else if (o.cls === 'tg') drawTarget();
    else if (o.kind === 'building') drawBuilding(o);
    else if (o.kind === 'string') drawString(o);
    else if (o.kind === 'cross') drawCross(o);
    else drawFurniture(o);
  }

  drawFog();
  drawPlayer();
  drawParticles();
  drawFloats();
  drawAtmosphere();
  drawIntensityFX();
  if (game.camFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (game.camFlash / 0.14 * 0.14).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  if (!(game.over && game.result === 'caught' && game.endTimer > 0.35)) drawHUD();   // (the CAUGHT card is clean: no HUD text showing through)
  drawBanner();
  drawWarning();
  drawEndScreen();
  drawMenuBtn();
  drawPauseOverlay();
  drawSpeaker();

  if (SCANLINES) ctx.drawImage(SPR.scan, 0, 0);   // retro screen overlay
}

let screen = 'home';          // 'home', 'play', 'shop', 'characters', 'stats', 'leaderboard'
let menuHover = null;
let menuFocus = 0;            // which home button the keyboard has selected
const HOME_BTNS = [
  { id: 'play',        label: 'PLAY',        x: 70,  y: 148, w: 260, h: 74, main: true },
  { id: 'shop',        label: 'SHOP',        x: 20,  y: 234, w: 175, h: 40 },
  { id: 'characters',  label: 'CHARACTERS',  x: 205, y: 234, w: 175, h: 40 },
  { id: 'stats',       label: 'STATS',       x: 20,  y: 282, w: 175, h: 40 },
  { id: 'leaderboard', label: 'LEADERBOARD', x: 205, y: 282, w: 175, h: 40 },
  { id: 'daily',       label: 'DAILY CHALLENGE', x: 20, y: 330, w: 360, h: 34 }
];
const BACK_BTN = { id: 'back', label: 'BACK', x: 110, y: 620, w: 180, h: 46 };
const MENU_BTN = { id: 'menu', label: 'HOME', x: 110, y: 560, w: 180, h: 40 };
const MAIN_BTN = { id: 'main', label: 'BACK TO MAIN PAGE', x: 50, y: 610, w: 300, h: 40 };            // end screens: back to the website
const MAIN_HOME_BTN = { id: 'main', label: 'MAIN PAGE', lines: ['BACK TO', 'MAIN PAGE'], x: 6, y: 628, w: 92, h: 52 };   // home screen: beside the wanted poster
function goMain() { sfx('click'); try { window.location.href = 'index.html'; } catch (e) { /* ignore */ } }   // same tab
const AGAIN_BTN = { id: 'again', label: 'CHASE AGAIN', x: 70, y: 500, w: 260, h: 50, glow: true };

const PAUSE_ITEMS = [
  { id: 'resume',  label: 'RESUME',        x: 100, y: 250, w: 200, h: 50 },
  { id: 'restart', label: 'RESTART CHASE', x: 100, y: 316, w: 200, h: 50 },
  { id: 'home',    label: 'HOME',          x: 100, y: 382, w: 200, h: 50 }
];
function pauseItemAt(p) {
  for (const b of PAUSE_ITEMS) if (hit(b, p)) return b.id;
  for (const b of PAUSE_AUDIO) if (hit(b, p)) return b.id;
  return null;
}
function setPaused(v) { if (!game.over) { if (v !== game.paused) sfx('click'); game.paused = v; } }
function pauseAction(id) {
  if (id === 'mus') toggleMusic();
  else if (id === 'sfx') toggleSfx();
  else if (id === 'resume') { game.paused = false; sfx('click'); }
  else if (id === 'restart') goTo(startPlay);
  else if (id === 'home') goTo(goHome);
}
function drawPauseOverlay() {
  if (!game.paused || game.over) return;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px monospace';
  ctx.fillStyle = '#a84a00'; ctx.fillText('PAUSED', W / 2 + 3, 203);
  ctx.fillStyle = '#ff8a00'; ctx.fillText('PAUSED', W / 2, 200);
  for (const b of PAUSE_ITEMS) drawBtn(b, menuHover === b.id, game.time + 1);
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = '#ffffff';
  drawAudioToggles(PAUSE_AUDIO, menuHover);
  ctx.fillText('ESC = RESUME', W / 2, 530);
}

function canvasPos(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}
function hit(b, p) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function inMenuBtn(p) { return hit(MENU_BTN, p); }
function inMainBtn(p) { return hit(MAIN_BTN, p); }
function endRetryReady() {
  if (!game.over) return false;
  return game.result === 'caught' ? game.endTimer > 0.5 : game.endTimer > T_FINAL + 0.5;
}
function menuButtonAt(p) {
  if (hit(AUD_MUSIC, p)) return 'mus';
  if (hit(AUD_SFX, p)) return 'sfx';
  if (screen === 'home') {
    if (hit(MAIN_HOME_BTN, p)) return 'main';
    for (const b of HOME_BTNS) if (hit({ x: b.x - 3, y: b.y - 4, w: b.w + 6, h: b.h + 8 }, p)) return b.id;   // a little extra touch room around each button
  } else {
    if (hit(BACK_BTN, p)) return 'back';
    if (screen === 'shop') for (let i = 0; i < SHOP_DEFS.length; i++) if (hit(shopCardRect(i), p)) return 'buy' + i;
    if (screen === 'characters') {
      for (let i = 0; i < CHARS.length; i++) if (hit(charThumbRect(i), p)) return 'cv' + i;
      if (hit(CHAR_ACT, p)) return 'cact';
    }
  }
  return null;
}
function goHome() {
  resetGame();                // a fresh world to show behind the menu
  screen = 'home';
  menuFocus = 0;
}
function startPlay() {
  beginRun();
  screen = 'play';
  canvas.style.cursor = 'default';
}
function openMenuItem(id) {
  if (id === 'mus') toggleMusic();
  else if (id === 'sfx') toggleSfx();
  else if (id === 'main') goMain();
  else if (id === 'play') goTo(startPlay);
  else if (id === 'back') goTo(function () { screen = 'home'; menuMsg.t = 0; });
  else if (id === 'cact') charAction();
  else if (id.indexOf('cv') === 0) { sfx('click'); charView = parseInt(id.substring(2), 10) || 0; menuMsg.t = 0; }
  else if (id.indexOf('buy') === 0) buyItem(parseInt(id.substring(3), 10) || 0);
  else goTo(function () { screen = id; menuMsg.t = 0; if (id === 'characters') charView = selIdx(); });
}
function menuTap(p) {
  const id = menuButtonAt(p);
  if (id) openMenuItem(id);
}
function menuKey(k) {
  if (screen === 'home') {
    if (k === 'arrowdown' || k === 's') menuFocus = (menuFocus + 1) % HOME_BTNS.length;
    else if (k === 'arrowup' || k === 'w') menuFocus = (menuFocus + HOME_BTNS.length - 1) % HOME_BTNS.length;
    else if (k === ' ' || k === 'enter') openMenuItem(HOME_BTNS[menuFocus].id);
  } else if (screen === 'characters') {
    if (k === 'arrowleft' || k === 'a') { charView = (charView + CHARS.length - 1) % CHARS.length; menuMsg.t = 0; }
    else if (k === 'arrowright' || k === 'd') { charView = (charView + 1) % CHARS.length; menuMsg.t = 0; }
    else if (k === 'enter' || k === ' ') charAction();
    else if (k === 'escape' || k === 'backspace') openMenuItem('back');
  } else if (screen === 'shop') {
    if (k === 'arrowleft' || k === 'a') shopFocus = (shopFocus + 3) % 4;
    else if (k === 'arrowright' || k === 'd') shopFocus = (shopFocus + 1) % 4;
    else if (k === 'arrowup' || k === 'w' || k === 'arrowdown' || k === 's') shopFocus = (shopFocus + 2) % 4;
    else if (k === 'enter' || k === ' ') buyItem(shopFocus);
    else if (k === 'escape' || k === 'backspace') openMenuItem('back');
  } else if (k === 'escape' || k === 'enter' || k === ' ' || k === 'backspace') {
    openMenuItem('back');
  }
}

// the city keeps scrolling slowly behind the menu
function homeWorld(dt) {
  game.time += dt;
  game.speed = 0.1;                         // the city drifts slowly: nowhere near chase speed
  game.vs = 0.1;
  game.distance += game.speed * dt * 40;
  if (game.distance > 600) game.distance = 150;
  game.intensity = 0;
  game.roadPos += game.vs * dt;
  game.markPos += game.vs * dt * MARK_SPEED;
  game.sidePos += game.vs * dt * SIDE_SPEED;
  updatePalette(metersLeft());
  updateScenery(dt);
}
function drawHomeWorld() {
  drawBackground();                         // sky, skyline, moon, NEWS helicopter and searchlight
  drawGround();
  drawFlat();
  drawQ.length = 0;
  const sc = game.scenery;
  for (let i = 0; i < sc.length; i++) if (!sc[i].flat) drawQ.push(sc[i]);
  drawQ.sort(bySort);
  for (let i = 0; i < drawQ.length; i++) {
    const o = drawQ[i];
    if (o.kind === 'building') drawBuilding(o);
    else if (o.kind === 'string') drawString(o);
    else if (o.kind === 'cross') drawCross(o);
    else drawFurniture(o);
  }
  drawFog();
}

// small background details: all quiet, all behind the menu
function drawHomeAtmos(t) {
  // flickering windows in the distance
  for (let i = 0; i < 46; i++) {
    const x = (i * 83 + 17) % 400, y = 110 + ((i * 47) % 130);
    const f = Math.sin(t * (0.6 + (i % 5) * 0.35) + i * 7.3);
    if (f > 0.9) {
      ctx.fillStyle = i % 3 ? 'rgba(255,225,150,0.75)' : 'rgba(150,220,255,0.7)';
      ctx.fillRect(x, y, 2, 3);
    }
  }
  // distant lights drifting slowly along the skyline
  for (let i = 0; i < 6; i++) {
    const x = ((t * (3 + i) + i * 71) % 460) - 30;
    ctx.fillStyle = i % 2 ? 'rgba(255,90,90,0.8)' : 'rgba(255,255,255,0.7)';
    ctx.fillRect(x, 246 - (i % 3) * 3, 2, 2);
  }
  // a distant taxi driving away down the road
  const cyc = (t % 18) / 18;
  if (cyc < 0.5) {
    const k = cyc / 0.5;
    const s2 = 0.36 - 0.3 * k;                        // gets smaller as it drives away
    const x = laneX(2, s2), y = groundY(s2);
    const w = 70 * s2, h = w * SPR.taxi.height / SPR.taxi.width;
    ctx.globalAlpha = Math.min(1, k * 6, (1 - k) * 3) * 0.9;
    blit(SPR.taxi, x - w / 2, y - h, w, h);
    glowAt('red', x - 0.3 * w, y - h * 0.5, 14 * s2 * 3, 0.7);
    glowAt('red', x + 0.3 * w, y - h * 0.5, 14 * s2 * 3, 0.7);
    ctx.globalAlpha = 1;
  }
  // blinking streetlight on the left
  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(25, 262, 4, 80);
  ctx.fillStyle = '#2c2c48'; ctx.fillRect(25, 260, 16, 4);
  const lamp = Math.sin(t * 2.2) > -0.55 ? 1 : (Math.sin(t * 40) > 0 ? 0.6 : 0.1);
  glowAt('warm', 38, 268, 70, 0.6 * lamp);
  ctx.fillStyle = 'rgba(255,240,180,' + lamp.toFixed(2) + ')';
  ctx.fillRect(36, 264, 6, 3);
  // steam rising from a street grate on the right
  for (let i = 0; i < 5; i++) {
    const ph = ((t * 0.35) + i / 5) % 1;
    const x = 372 + Math.sin(ph * 5 + i) * 6, y = 340 - ph * 46;
    ctx.fillStyle = 'rgba(210,205,235,' + (0.2 * (1 - ph)).toFixed(3) + ')';
    const r2 = 4 + ph * 9;
    ctx.fillRect(Math.round(x - r2), Math.round(y - r2 * 0.7), Math.round(r2 * 2), Math.round(r2 * 1.4));
  }
  // an occasional camera flash far away
  const fc = (t % 7.3);
  if (fc > 6.2 && fc < 6.35) glowAt('white', 352, 285, 60, 0.9);
  if (fc > 6.45 && fc < 6.55) glowAt('white', 46, 296, 50, 0.7);
  // light fog drifting
  for (let i = 0; i < 3; i++) {
    const x = ((t * (4 + i * 2) + i * 170) % 640) - 120;
    glowAt('violet', x, 262 + i * 14, 260, 0.1);
  }
  // keep the background a little darker than the menu
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(4,2,16,0.5)');
  g.addColorStop(0.5, 'rgba(4,2,16,0.4)');
  g.addColorStop(1, 'rgba(4,2,16,0.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawBtn(b, active, t) {
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  ctx.save();
  const n = 4;                                              // notched pixel corners
  function shape(x, y, w, h) {
    ctx.beginPath();
    ctx.moveTo(x + n, y); ctx.lineTo(x + w - n, y); ctx.lineTo(x + w - n, y + n); ctx.lineTo(x + w, y + n);
    ctx.lineTo(x + w, y + h - n); ctx.lineTo(x + w - n, y + h - n); ctx.lineTo(x + w - n, y + h); ctx.lineTo(x + n, y + h);
    ctx.lineTo(x + n, y + h - n); ctx.lineTo(x, y + h - n); ctx.lineTo(x, y + n); ctx.lineTo(x + n, y + n);
    ctx.closePath();
  }
  ctx.fillStyle = OR_DD;                                    // pixel drop shadow
  shape(b.x + 4, b.y + 5, b.w, b.h); ctx.fill();
  ctx.fillStyle = (active && !b.main) ? OR : '#000000';     // black button (orange when hovered)
  shape(b.x, b.y, b.w, b.h); ctx.fill();
  if (b.main || b.glow) { ctx.shadowColor = OR; ctx.shadowBlur = 8 + 8 * pulse + (active ? 6 : 0); }
  ctx.lineWidth = b.main ? 6 : 4;
  ctx.strokeStyle = OR;
  if (b.main || b.glow) ctx.globalAlpha = 0.7 + 0.3 * pulse;
  shape(b.x + 3, b.y + 3, b.w - 6, b.h - 6); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0; ctx.shadowColor = 'rgba(0,0,0,0)';
  ctx.fillStyle = OR_D;                                     // thin inner line for a pixel-art bevel
  ctx.fillRect(b.x + 10, b.y + (b.main ? 11 : 8), b.w - 20, 2);
  ctx.textAlign = 'center';
  const fs = b.main ? 46 : (b.lines ? 12 : (b.h < 40 ? 15 : 19));
  ctx.font = 'bold ' + fs + 'px monospace';
  const ty = b.y + b.h / 2 + (b.main ? 16 : (b.h < 40 ? 5 : 7));
  ctx.fillStyle = (active && !b.main) ? '#000000' : OR;
  if (b.main) { ctx.fillStyle = OR_D; ctx.fillText(b.label, b.x + b.w / 2 + 3, ty + 3); ctx.fillStyle = OR; }
  if (b.lines) {                                            // small two-line label
    ctx.fillText(b.lines[0], b.x + b.w / 2, b.y + b.h / 2 - 3);
    ctx.fillText(b.lines[1], b.x + b.w / 2, b.y + b.h / 2 + 12);
  } else ctx.fillText(b.label, b.x + b.w / 2, ty);
  if (b.main) {                                             // white pixel arrows left and right
    const my = b.y + b.h / 2;
    ctx.fillStyle = '#ffffff';
    const nudge = Math.round(Math.sin(t * 4) * 3);           // arrows gently pulse toward the word
    for (const sx0 of [b.x + 34, b.x + b.w - 34]) {
      const flip = sx0 < W / 2 ? -1 : 1;
      const sx = sx0 - flip * nudge;
      for (let i = 0; i < 6; i++) {                         // stepped (pixel) triangle
        const px = sx - flip * 12 + flip * i * 4;
        const hh = (6 - i) * 4 - 2;
        ctx.fillRect(flip > 0 ? px : px - 4, my - hh, 4, hh * 2);
      }
    }
  }
  ctx.restore();
}

// ---------- WANTED POSTER (bottom of the home screen) ----------
const WANTED_BOUNTY = 1000;                    // change this number to change the bounty on the poster
const WANTED_NAME = 'PRISONER 67';
function commaNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function drawWantedPoster(t) {
  const px = 110, py = 506, pw = 180, ph = 188;
  ctx.fillStyle = OR_DD;                                        // shadow
  ctx.fillRect(px + 5, py + 6, pw, ph);
  ctx.fillStyle = '#000000';                                    // black border
  ctx.fillRect(px - 4, py - 4, pw + 8, ph + 8);
  ctx.fillStyle = '#f2e8cc';                                    // cream paper
  ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = '#e4d6ae';                                    // paper shading
  ctx.fillRect(px, py + ph - 6, pw, 6);
  ctx.fillRect(px + pw - 5, py, 5, ph);
  ctx.fillStyle = '#000000';                                    // inner pixel frame
  ctx.fillRect(px + 8, py + 8, pw - 16, 2);
  ctx.fillRect(px + 8, py + ph - 6, pw - 16, 2);
  ctx.fillStyle = '#c9c2a8';                                    // tape on the top corners
  ctx.fillRect(px - 8, py - 8, 22, 9); ctx.fillRect(px + pw - 14, py - 8, 22, 9);

  ctx.textAlign = 'center';
  ctx.font = 'bold 34px monospace';
  ctx.lineWidth = 5; ctx.strokeStyle = '#000000';
  ctx.strokeText('WANTED', px + pw / 2, py + 40);
  ctx.fillStyle = '#e0121c';
  ctx.fillText('WANTED', px + pw / 2, py + 40);

  // the prisoner turns slowly on the spot: front, side, back, side, front
  const ang = (Math.max(0, t) * Math.PI * 2 / 12) % (Math.PI * 2);           // one full turn every 12 seconds
  const c = Math.cos(ang), sn = Math.sin(ang);
  const f = Math.abs(Math.floor(t * 2)) % 2;
  const ks = 4, w = 16 * ks, h = 24 * ks;
  const cx = px + pw / 2, gy = py + 142;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(cx - 28, gy - 2, 56, 5);
  ctx.save();
  ctx.translate(cx, gy);
  let scale, img, mirror = false, back = false;
  if (Math.abs(c) >= 0.5) {
    back = c < 0;
    img = back ? SPR.target.back[0] : SPR.target.front[0];
    scale = Math.abs(c);
  } else {
    img = SPR.tgtSide[f];
    scale = 0.72;
    mirror = sn < 0;                                            // faces the other way on the second half
  }
  ctx.scale(mirror ? -scale : scale, 1);
  blit(img, -w / 2, -h, w, h);
  if (back) drawBackPrint(0, -h + 7 * ks, ks);                  // PRISONER 67 on the jumpsuit back
  ctx.restore();

  ctx.font = 'bold 15px monospace';
  ctx.fillStyle = '#000000';
  ctx.fillText(WANTED_NAME, px + pw / 2, py + 160);
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = '#b00d16';
  ctx.fillText('BOUNTY: ' + commaNum(WANTED_BOUNTY) + ' CASE COINS', px + pw / 2, py + 175);
}

// ----- pixel screen transitions (quick) -----
let trans = null;
function goTo(fn) { if (!trans) sfx('click'); if (!trans) trans = { t: 0, dur: 0.3, fn: fn, did: false }; }
function finishTrans() { if (trans) { if (!trans.did && trans.fn) trans.fn(); trans = null; } }
function updateTrans(dt) {
  if (!trans) return;
  trans.t += dt;
  if (!trans.did && trans.t >= trans.dur / 2) { trans.did = true; if (trans.fn) trans.fn(); }
  if (trans.t >= trans.dur) trans = null;
}
function drawPixelCover(a, y0, y1) {
  if (a <= 0) return;
  ctx.fillStyle = '#04020f';
  const cs = 25;
  for (let cy = Math.floor(y0 / cs); cy * cs < y1; cy++) {
    for (let cx = 0; cx * cs < W; cx++) {
      const v = (((cx * 73856093) ^ (cy * 19349663)) >>> 0) % 1000 / 1000;
      if (v < a) ctx.fillRect(cx * cs, cy * cs, cs, cs);
    }
  }
}
function drawTrans() {
  if (!trans) return;
  const p = Math.min(1, trans.t / trans.dur);
  drawPixelCover(p < 0.5 ? p * 2 : (1 - p) * 2, 0, H);
}

  const mq = window.matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)');
  const onTurn = function () { if (mq.matches && screen === 'play' && !game.over) game.paused = true; };
  if (mq.addEventListener) mq.addEventListener('change', onTurn); else if (mq.addListener) mq.addListener(onTurn);
} catch (e) { /* ignore */ }

// =====================================================
// AUDIO: every sound and the music are made with Web Audio right here.
// Nothing is downloaded, so nothing can break, and nothing copyrighted is used.
// The sound only starts after your first tap / click / key press (browsers require that).
// =====================================================
const audioPrefs = { music: true, sfx: true };
try {
  const a = JSON.parse(localStorage.getItem('catchem_audio') || 'null');
  if (a) { if (a.music === false) audioPrefs.music = false; if (a.sfx === false) audioPrefs.sfx = false; }
} catch (e) { /* ignore */ }
function saveAudio() { try { localStorage.setItem('catchem_audio', JSON.stringify(audioPrefs)); } catch (e) { /* ignore */ } }

let AU = null;                 // the sound engine (created on the first user interaction)
let audioFailed = false;
function audioUnlock() {
  if (audioFailed) return;
  try {
    if (!AU) {
      const AC = (typeof AudioContext !== 'undefined') ? AudioContext : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if (!AC) { audioFailed = true; return; }
      AU = makeEngine(new AC(), false);
    }
    if (AU.ac.state === 'suspended') AU.ac.resume();
  } catch (e) { AU = null; audioFailed = true; }
}
function sfx(name, arg) {
  if (AU && audioPrefs.sfx) { try { AU.play(name, arg); } catch (e) { /* never let a sound break the game */ } }
}
function toggleMusic() { audioPrefs.music = !audioPrefs.music; saveAudio(); audioUnlock(); sfx('click'); }
function toggleSfx() { audioPrefs.sfx = !audioPrefs.sfx; saveAudio(); audioUnlock(); sfx('click'); }
function toggleMaster() {                       // the little speaker in the corner: everything on / everything off
  const on = audioPrefs.music || audioPrefs.sfx;
  audioPrefs.music = audioPrefs.sfx = !on;
  saveAudio(); audioUnlock(); sfx('click');
}

function makeEngine(ac, offline) {
  const E = { ac: ac, mode: 'none', tempo: 112, step: 0, next: 0, voices: 0 };
  const cap = offline ? 1e9 : 28;                       // never more than 28 sounds at once
  const master = ac.createGain(); master.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 24; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
  master.connect(comp); comp.connect(ac.destination);
  const sfxBus = ac.createGain(); sfxBus.gain.value = 1.5; sfxBus.connect(master);
  const ambBus = ac.createGain(); ambBus.gain.value = 0.07; ambBus.connect(master);
  const musFilter = ac.createBiquadFilter(); musFilter.type = 'lowpass'; musFilter.frequency.value = 18000;
  const musBus = ac.createGain(); musBus.gain.value = 0.0001; musBus.connect(musFilter); musFilter.connect(master);

  const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * 2), ac.sampleRate);   // 2 seconds of noise, reused by everything
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  // ----- building blocks -----
  function tone(type, f0, f1, t, dur, vol, bus, att) {
    if (E.voices >= cap) return;
    E.voices++;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + (att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus);
    o.onended = function () { E.voices--; try { g.disconnect(); } catch (e) { /* ignore */ } };
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(ftype, f0, f1, t, dur, vol, bus, q) {
    if (E.voices >= cap) return;
    E.voices++;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb;
    f.type = ftype; f.Q.value = q || 0.7;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus);
    s.onended = function () { E.voices--; try { g.disconnect(); } catch (e) { /* ignore */ } };
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.03);
  }
  const N = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };      // note number -> Hz

  // ----- sound effects (kept short and quiet) -----
  const S = {
    coin: function (t) { tone('square', 988, 988, t, 0.07, 0.15, sfxBus); tone('square', 1319, 1319, t + 0.07, 0.16, 0.15, sfxBus); },
    item: function (t) { tone('triangle', 520, 780, t, 0.13, 0.22, sfxBus); },
    jump: function (t) { tone('square', 260, 640, t, 0.14, 0.22, sfxBus); },
    slide: function (t) { noise('bandpass', 2400, 500, t, 0.26, 0.4, sfxBus, 1.2); },
    crash: function (t) { noise('lowpass', 1300, 100, t, 0.4, 0.9, sfxBus, 0.7); tone('sine', 140, 38, t, 0.32, 0.8, sfxBus); },
    perfect: function (t) { [76, 79, 83, 88].forEach(function (m, i) { tone('triangle', N(m), N(m), t + i * 0.055, 0.18, 0.24, sfxBus); }); },
    combo: function (t, m) { tone('sine', N(70 + 2 * (m || 2)), N(74 + 2 * (m || 2)), t, 0.12, 0.25, sfxBus); },
    power: function (t) { [72, 76, 79, 84].forEach(function (m, i) { tone('square', N(m), N(m), t + i * 0.06, 0.12, 0.13, sfxBus); }); },
    magnet: function (t) { tone('sawtooth', 220, 900, t, 0.3, 0.13, sfxBus); tone('sine', 900, 330, t + 0.3, 0.22, 0.18, sfxBus); },
    shieldGet: function (t) { tone('sine', 880, 880, t, 0.5, 0.22, sfxBus); tone('sine', 1320, 1320, t, 0.4, 0.13, sfxBus); },
    boost: function (t) { tone('sawtooth', 200, 900, t, 0.34, 0.12, sfxBus); tone('square', 900, 900, t + 0.3, 0.12, 0.1, sfxBus); },
    shield: function (t) { noise('highpass', 4200, 2600, t, 0.26, 0.5, sfxBus, 0.7); tone('triangle', 1500, 300, t, 0.26, 0.26, sfxBus); },
    camera: function (t) { noise('highpass', 3200, 3200, t, 0.035, 0.5, sfxBus); noise('highpass', 2000, 2000, t + 0.05, 0.06, 0.45, sfxBus); },
    warn: function (t) { for (let k = 0; k < 2; k++) { tone('square', 760, 760, t + k * 0.22, 0.1, 0.12, sfxBus); tone('square', 540, 540, t + k * 0.22 + 0.11, 0.1, 0.12, sfxBus); } },
    caught: function (t) {
      [60, 64, 67, 72].forEach(function (m, i) { tone('square', N(m), N(m), t + i * 0.1, 0.45, 0.14, sfxBus); });
      [72, 76, 79].forEach(function (m) { tone('triangle', N(m), N(m), t + 0.42, 0.9, 0.2, sfxBus); });
    },
    escape: function (t) {                               // a sad, slightly silly "wah wah wah waaah"
      [67, 66, 65].forEach(function (m, i) { tone('sawtooth', N(m), N(m) * 0.97, t + i * 0.34, 0.32, 0.12, sfxBus); });
      tone('sawtooth', N(64), N(58), t + 1.02, 0.7, 0.14, sfxBus);
    },
    click: function (t) { tone('triangle', 900, 600, t, 0.045, 0.12, sfxBus); },
    buy: function (t) { tone('square', 1047, 1047, t, 0.06, 0.13, sfxBus); tone('square', 1568, 1568, t + 0.06, 0.13, 0.13, sfxBus); },
    deny: function (t) { tone('square', 200, 150, t, 0.2, 0.14, sfxBus); }
  };
  const GAP = { coin: 0.05, camera: 0.12, click: 0.03, item: 0.05, jump: 0.08, slide: 0.08, combo: 0.1, warn: 1.0 };
  const last = {};
  E.play = function (name, arg) {
    const f = S[name];
    if (!f) return;
    const now = ac.currentTime;
    if (last[name] !== undefined && now - last[name] < (GAP[name] || 0.04)) return;   // sounds can't stack up
    last[name] = now;
    f(now + 0.01, arg);
  };

  // ----- ambience: the helicopter and the airplane (two quiet loops that are only turned up when they are on screen) -----
  const heliGain = ac.createGain(); heliGain.gain.value = 0; heliGain.connect(ambBus);
  const planeGain = ac.createGain(); planeGain.gain.value = 0; planeGain.connect(ambBus);
  const hn = ac.createBufferSource(); hn.buffer = nb; hn.loop = true;
  const hf = ac.createBiquadFilter(); hf.type = 'bandpass'; hf.frequency.value = 240; hf.Q.value = 0.8;
  const hAmp = ac.createGain(); hAmp.gain.value = 0.5;
  const lfo = ac.createOscillator(); lfo.frequency.value = 11;
  const lfoG = ac.createGain(); lfoG.gain.value = 0.45;
  lfo.connect(lfoG); lfoG.connect(hAmp.gain);
  hn.connect(hf); hf.connect(hAmp); hAmp.connect(heliGain);
  const hum = ac.createOscillator(); hum.type = 'sine'; hum.frequency.value = 58;
  const humG = ac.createGain(); humG.gain.value = 0.25;
  hum.connect(humG); humG.connect(heliGain);
  const p1 = ac.createOscillator(), p2 = ac.createOscillator();
  p1.type = 'sawtooth'; p2.type = 'sawtooth'; p1.frequency.value = 96; p2.frequency.value = 99;
  const pf = ac.createBiquadFilter(); pf.type = 'lowpass'; pf.frequency.value = 650;
  const pg = ac.createGain(); pg.gain.value = 0.5;
  p1.connect(pf); p2.connect(pf); pf.connect(pg); pg.connect(planeGain);
  hn.start(0); lfo.start(0); hum.start(0); p1.start(0); p2.start(0);

  // ----- the music: a little loop that builds up as you get closer to the party -----
  const R_CHASE = [45, 41, 48, 43], C_CHASE = [[57, 60, 64], [57, 60, 65], [60, 64, 67], [59, 62, 67]];
  const R_PARTY = [48, 45, 41, 43], C_PARTY = [[60, 64, 67], [57, 60, 64], [57, 60, 65], [59, 62, 67]];
  const HOOK_A = [76, 0, 79, 0, 81, 79, 0, 76, 74, 0, 76, 0, 72, 0, 0, 0];
  const HOOK_B = [74, 0, 77, 0, 79, 77, 0, 74, 72, 0, 74, 0, 67, 0, 0, 0];
  const CHASE_HOOK = [69, 0, 72, 0, 76, 0, 72, 69];
  function kick(t, v) { tone('sine', 150, 45, t, 0.14, v, musBus); }
  function snare(t, v) { noise('bandpass', 1900, 1400, t, 0.13, v, musBus, 0.8); tone('triangle', 210, 150, t, 0.08, v * 0.5, musBus); }
  function hat(t, v) { noise('highpass', 8000, 8000, t, 0.035, v, musBus); }
  function clap(t, v) { noise('bandpass', 1500, 1500, t, 0.1, v, musBus, 1.5); }
  function level() {                                  // 0 = start, 1 = middle, 2 = final 750m (or very close to catching him)
    const d = game.distance;
    let L = d >= 2750 ? 2 : (d >= 1500 ? 1 : 0);
    if (game.meter >= 80 && L < 1) L = 1;
    return L;
  }
  function tempoTarget() {
    if (E.mode === 'party') return 126;
    const d = game.distance;
    return 112 + 10 * Math.min(1, Math.max(0, d / 2750)) + 28 * Math.min(1, Math.max(0, (d - 2750) / 750));
  }
  E.level = level; E.tempoTarget = tempoTarget;
  function stepChase(step, t) {
    const bar = (step >> 4) & 3, s = step & 15, L = level();
    const root = R_CHASE[bar], ch = C_CHASE[bar];
    const kicks = L === 0 ? [0, 8] : (L === 1 ? [0, 4, 8, 12] : [0, 4, 8, 10, 12, 14]);
    if (kicks.indexOf(s) >= 0) kick(t, 0.5);
    if (s === 4 || s === 12 || (L === 2 && s === 15)) snare(t, s === 15 ? 0.1 : 0.22);
    if (L === 2) hat(t, s % 4 === 2 ? 0.07 : 0.04); else if (s % 2 === 0 && (L === 1 || s % 4 === 2)) hat(t, 0.05);
    const bassSteps = L === 2 ? [0, 2, 4, 6, 8, 10, 12, 14] : [0, 3, 6, 8, 11, 14];
    if (bassSteps.indexOf(s) >= 0) {
      const oct = (s === 6 || s === 14) ? 12 : 0;
      tone('triangle', N(root + oct), N(root + oct), t, 0.16, 0.3, musBus);
      tone('square', N(root + oct), N(root + oct), t, 0.1, 0.04, musBus);
    }
    const idx = [0, 1, 2, 1, 0, 1, 2, 1, 0, 1, 2, 1, 2, 1, 0, 1][s];       // sparkly arpeggio
    tone('square', N(ch[idx] + (L === 2 ? 12 : 0)), N(ch[idx] + (L === 2 ? 12 : 0)), t, 0.1, L === 2 ? 0.065 : 0.05, musBus);
    if (L >= 1 && s % 4 === 0) tone('sawtooth', N(ch[idx] + 12), N(ch[idx] + 12), t, 0.12, 0.025, musBus);
    if ((bar === 1 || bar === 3) && s < 8 && CHASE_HOOK[s]) tone('square', N(CHASE_HOOK[s]), N(CHASE_HOOK[s]), t, 0.11, 0.07, musBus);
    if (bar === 3 && s === 12 && (step >> 6) % 2 === 1) tone('sine', 1300, 320, t, 0.4, 0.07, musBus);   // a silly slide-whistle every other loop
  }
  function stepParty(step, t) {
    const bar = (step >> 4) & 3, s = step & 15;
    const root = R_PARTY[bar], ch = C_PARTY[bar];
    if (s % 4 === 0) kick(t, 0.5);
    if (s === 4 || s === 12) clap(t, 0.22);
    if (s % 4 === 2) hat(t, 0.07);
    if (s === 0 || s === 8) tone('triangle', N(root), N(root), t, 0.2, 0.32, musBus);                 // oom
    if (s === 4 || s === 12) tone('triangle', N(root + 7), N(root + 7), t, 0.16, 0.26, musBus);       // pah
    if (s % 4 === 2) ch.forEach(function (m) { tone('square', N(m), N(m), t, 0.09, 0.04, musBus); });  // chord stabs
    const mel = (bar % 2 === 0 ? HOOK_A : HOOK_B)[s];
    if (mel) tone('square', N(mel), N(mel), t, 0.13, 0.07, musBus);
    if (bar === 3 && s === 14) tone('sine', 500, 1500, t, 0.25, 0.08, musBus);                      // whoop!
  }
  function stepNow(t) {
    if (E.mode === 'chase') stepChase(E.step, t); else if (E.mode === 'party') stepParty(E.step, t);
    E.tempo += (tempoTarget() - E.tempo) * 0.06;                                                      // tempo changes smoothly
    E.next += 60 / E.tempo / 4;
    E.step++;
  }
  let timer = null;
  function tick() {
    if (E.mode === 'none') return;
    const now = ac.currentTime;
    if (E.next < now - 0.3) E.next = now + 0.05;        // (tab was in the background: don't rush to catch up)
    while (E.next < now + 0.15) stepNow(E.next);
  }
  E.sched = function (until) { while (E.next < until) stepNow(E.next); };      // used by the offline test
  E.setMode = function (m) {
    if (m === E.mode) return;
    E.mode = m;
    if (m === 'none') {
      if (timer) { clearInterval(timer); timer = null; }
    } else {
      E.step = 0;
      E.next = ac.currentTime + 0.08;
      E.tempo = m === 'party' ? 126 : tempoTarget();
      if (!timer && !offline) timer = setInterval(tick, 30);
    }
  };
  E.frame = function (info) {
    const t = ac.currentTime;
    const musicOn = audioPrefs.music && info.mode !== 'none';
    musBus.gain.setTargetAtTime(musicOn ? 0.42 * info.level : 0.0001, t, 0.12);
    musFilter.frequency.setTargetAtTime(info.ducked ? 600 : 18000, t, 0.1);
    heliGain.gain.setTargetAtTime(audioPrefs.sfx ? info.heli : 0, t, 0.25);
    planeGain.gain.setTargetAtTime(audioPrefs.sfx ? info.plane : 0, t, 0.25);
    p1.frequency.setTargetAtTime(96 * info.dopp, t, 0.1);
    p2.frequency.setTargetAtTime(99 * info.dopp, t, 0.1);
  };
  return E;
}

// what the sound should be doing right now (called once per frame)
function audioFrame() {
  if (!AU) return;
  let mode = 'none', level = 1, heli = 0, plane = 0, dopp = 1;
  const playing = screen === 'play';
  if (playing) {
    if (!game.over) {
      mode = 'chase';
      if (game.paused) {
        level = 0.3;                                    // paused: music goes quiet and muffled, ambience stops
      } else {
        const h = game.heli, p = game.plane;
        if (h.on) heli = Math.min(1, Math.max(0, Math.min(h.x + 130, W + 140 - h.x) / 160)) * 0.9;
        if (p.on) {
          plane = Math.min(1, Math.max(0, Math.min(p.x + 40, W + 300 - p.x) / 200)) * 0.9;
          dopp = 1.08 - 0.16 * Math.min(1, Math.max(0, p.x / (W + 300)));
        }
      }
    } else if (game.result === 'escaped' && game.endTimer >= T_SCENE - 0.3) {
      mode = 'party';
      level = game.endTimer < T_FINAL ? 1 : 0.55;       // party music while the party is on screen, quieter under the results
    }
  }
  AU.setMode(mode);
  AU.frame({ mode: mode, level: level, ducked: playing && game.paused && !game.over, heli: heli, plane: plane, dopp: dopp });
}


// ----- audio buttons -----
const SND_BTN = { x: 6, y: 46, w: 32, h: 26 };                       // little speaker in the corner while chasing
const AUD_MUSIC = { id: 'mus', x: 14, y: 20, w: 104, h: 34 };       // on the home / menu screens
const AUD_SFX   = { id: 'sfx', x: 282, y: 20, w: 104, h: 34 };
const PAUSE_AUDIO = [
  { id: 'mus', x: 100, y: 448, w: 96, h: 36 },
  { id: 'sfx', x: 204, y: 448, w: 96, h: 36 }
];
function drawToggle(b, label, on, active) {
  ctx.fillStyle = OR_DD; ctx.fillRect(b.x + 3, b.y + 4, b.w, b.h);
  ctx.fillStyle = active ? '#2a1400' : '#000000'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = on ? OR : '#6a4a30'; ctx.lineWidth = 3; ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
  ctx.textAlign = 'center';
  ctx.font = 'bold 10px monospace'; ctx.fillStyle = on ? '#ffffff' : '#8a7a6a';
  ctx.fillText(label, b.x + b.w / 2, b.y + 15);
  ctx.font = 'bold 11px monospace'; ctx.fillStyle = on ? '#6dff9a' : '#ff6a5a';
  ctx.fillText(on ? 'ON' : 'OFF', b.x + b.w / 2, b.y + b.h - 8);
}
function drawAudioToggles(list, active) {
  for (const b of list) {
    if (b.id === 'mus') drawToggle(b, 'MUSIC', audioPrefs.music, active === 'mus');
    else drawToggle(b, 'SOUND FX', audioPrefs.sfx, active === 'sfx');
  }
}
function drawSpeaker() {
  const b = SND_BTN, on = audioPrefs.music || audioPrefs.sfx;
  ctx.fillStyle = '#000000'; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = on ? '#ff8a00' : '#6a4a30'; ctx.lineWidth = 3; ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
  ctx.fillStyle = on ? '#ffffff' : '#8a7a6a';
  ctx.fillRect(b.x + 7, b.y + 10, 5, 6);
  ctx.fillRect(b.x + 12, b.y + 8, 3, 10);
  ctx.fillRect(b.x + 15, b.y + 6, 2, 14);
  if (on) { ctx.fillRect(b.x + 20, b.y + 9, 2, 8); ctx.fillRect(b.x + 23, b.y + 7, 2, 12); }
  else { ctx.fillStyle = '#ff2a4d'; for (let i = 0; i < 8; i++) { ctx.fillRect(b.x + 19 + i, b.y + 9 + i, 2, 2); ctx.fillRect(b.x + 26 - i, b.y + 9 + i, 2, 2); } }
}

// ---------- START AND GAME LOOP ----------
resetGame();

let lastTime = performance.now();
let badFrames = 0;
function loop(now) {
  requestAnimationFrame(loop);                       // ask for the next frame FIRST, so one error can never stop the game
  try {
    const t = (typeof now === 'number' && isFinite(now)) ? now : performance.now();
    const dt = Math.max(0, Math.min(0.05, (t - lastTime) / 1000));
    lastTime = t;
    if (screen === 'play') { update(dt); draw(); } else { menuFrame(dt); }
    updateTrans(dt);
    drawTrans();
    badFrames = 0;
    window.__started = true;
  } catch (e) {
    badFrames++;
    if (badFrames === 1 && window.console) console.error(e);
    if (!window.__started || badFrames > 120) window.__showErr((e && e.message) || 'error');   // still broken after 2 seconds: say so
  }
  try { audioFrame(); } catch (e) { /* sound problems must never matter */ }
}
requestAnimationFrame(loop);
</script>
