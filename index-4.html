// Safety net: if anything stops the game from starting, say so on screen (instead of a blank purple screen).
window.__started = false;
window.__showErr = function (msg) {
  try {
    if (document.getElementById('errbox')) return;
    var d = document.createElement('div');
    d.id = 'errbox';
    d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99;background:#000;color:#ff8a00;font:bold 16px monospace;padding:24px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.5';
    d.innerHTML = "CATCH 'EM COULD NOT START<br><small style='color:#ffd9a8;font-size:12px;word-break:break-word'></small><br><small style='color:#fff'>TAP TO RELOAD</small>";
    d.getElementsByTagName('small')[0].textContent = String(msg).slice(0, 240);
    d.onclick = function () { location.reload(); };
    document.body.appendChild(d);
  } catch (e) { /* nothing more we can do */ }
};
window.addEventListener('error', function (ev) { if (!window.__started) window.__showErr((ev && ev.message) || 'unknown error'); });
window.addEventListener('unhandledrejection', function () { /* promises are not used by the game */ });
</script>

function progressMissions() {
  game.missionDone = [];

// makeSprite(width, height, drawingFunction)
// Inside the drawing function, r(x, y, w, h, color) paints a block of pixels.
function makeSprite(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  const r = function (x, y, rw, rh, color) {
    g.fillStyle = color;
    g.fillRect(x, y, rw, rh);
  };
  fn(r, g);
  return c;
}

// a repeatable "random" number generator (so buildings look the same every time)
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a * 1664525 + 1013904223) >>> 0;
    return a / 4294967296;
  };
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

// colour helpers: '#rrggbb' <-> [r, g, b]
function hexRGB(c) {
  return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)];
}
function mixRGB(out, a, b, t) {
  out[0] = a[0] + (b[0] - a[0]) * t;
  out[1] = a[1] + (b[1] - a[1]) * t;
  out[2] = a[2] + (b[2] - a[2]) * t;
}
function rgb(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }
function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a.toFixed(3) + ')'; }

// draws a sprite on the screen, optionally mirrored left-to-right
function blit(img, x, y, w, h, flip) {
  if (flip) {
    ctx.save();
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, w, h);
    ctx.restore();
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
}

// a soft round glow picture
function makeGlow(rr, gg, bb) {
  return makeSprite(64, 64, function (r, g) {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(' + rr + ',' + gg + ',' + bb + ',1)');
    gr.addColorStop(1, 'rgba(' + rr + ',' + gg + ',' + bb + ',0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
  });
}

// draws a glow (light adds on top of what is already there)
function glowAt(name, cx, cy, size, alpha) {
  if (alpha <= 0.01 || size < 2) return;
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha > 1 ? 1 : alpha;
  ctx.drawImage(SPR.glow[name], cx - size / 2, cy - size / 2, size, size);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;
}

// text with a dark outline so it stays readable over the artwork
function outlineText(text, x, y, fill, width) {
  ctx.lineJoin = 'round';
  ctx.lineWidth = width || 4;
  ctx.strokeStyle = '#0b0718';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

const COLOR_KEYS = ['skyTop','skyMid','skyLow','skyHor','roadA','roadB','roadC','walk','edge','outer','fog','haze','lane'];
const NUM_KEYS = ['water','neon','stars','dens','traffic'];

// the "current" blended look of the world (changes smoothly between districts)
const PAL = { a: 0, b: 0, t: 0, cur: 0 };
COLOR_KEYS.forEach(function (k) { PAL[k] = [0, 0, 0]; });
NUM_KEYS.forEach(function (k) { PAL[k] = 0; });
ZONES.forEach(function (z) {
  z.rgb = {};
  COLOR_KEYS.forEach(function (k) { z.rgb[k] = hexRGB(z.c[k]); });
});

// zoneAt(metersLeft, out): which district are we in, and are we melting into the next one?
function zoneAt(m, out) {
  if (m < 0) m = 0;
  let k = 0;
  for (let i = 0; i < ZONES.length; i++) {
    if (m >= ZONES[i].lo) { k = i; break; }
  }
  let t = 0;
  if (k < ZONES.length - 1) {
    const d = m - ZONES[k].lo;
    if (d < BLEND) t = 1 - d / BLEND;
  }
  out.a = k;
  out.b = Math.min(ZONES.length - 1, k + 1);
  out.t = t;
  return out;
}
const ZB = { a: 0, b: 0, t: 0 };
const ZS = { a: 0, b: 0, t: 0 };

function updatePalette(m) {
  zoneAt(m - 20, ZB);
  const A = ZONES[ZB.a], B = ZONES[ZB.b], t = ZB.t;
  for (let i = 0; i < COLOR_KEYS.length; i++) {
    const k = COLOR_KEYS[i];
    mixRGB(PAL[k], A.rgb[k], B.rgb[k], t);
  }
  for (let i = 0; i < NUM_KEYS.length; i++) {
    const k = NUM_KEYS[i];
    PAL[k] = lerp(A.n[k], B.n[k], t);
  }
  PAL.a = ZB.a; PAL.b = ZB.b; PAL.t = t;
  PAL.cur = t >= 0.5 ? ZB.b : ZB.a;
}

// which district should a NEW object (appearing far away) belong to?
function spawnZone(extraMeters) {
  zoneAt(metersLeft() - 38 - (extraMeters || 0), ZS);
  return Math.random() < ZS.t ? ZS.b : ZS.a;
}

function pickWeighted(tab) {
  let tot = 0;
  for (let i = 0; i < tab.length; i++) tot += tab[i][1];
  let r = Math.random() * tot;
  for (let i = 0; i < tab.length; i++) {
    r -= tab[i][1];
    if (r <= 0) return tab[i][0];
  }
  return tab[0][0];
}

function makeBuildingZ(zi, v) {
  const id = ZONES[zi].id, S = BSTY[id];
  const R = rng((zi + 1) * 7919 + v * 104729 + RUN_SEED);
  const pick = function (a) { return a[Math.floor(R() * a.length)]; };
  const w = S.w[0] + Math.floor(R() * (S.w[1] - S.w[0] + 1));
  const h = S.h[0] + Math.floor(R() * (S.h[1] - S.h[0] + 1));
  const pal = pick(S.bases), neon = pick(S.neon), neon2 = pick(S.neon);
  const top = BUILD_HEAD;
  const gy = top + h - 10;                 // top of the ground floor
  const cv = makeSprite(w, h + top, function (r, g) {
    const base = pal[0], light = pal[1], dark = pal[2], winDark = pal[3];

    // ----- ROOF -----
    if (id === 'estate') {
      const rows = Math.min(top - 1, Math.floor((w - 2) / 4));
      const roof = pick(['#3a2a5a', '#5a2a3a', '#2a3a5a', '#4a3a2a']);
      r(Math.floor(w * 0.72), top - rows - 2, 3, rows + 2, '#7a5a4a');
      for (let j = 0; j < rows; j++) {
        r(j * 2, top - 1 - j, w - j * 4, 1, roof);
        r(j * 2, top - 1 - j, 2, 1, 'rgba(255,255,255,0.25)');
      }
    } else if (id === 'lantern') {
      r(0, top - 2, w, 2, '#7a1a1a');
      r(0, top - 3, w, 1, '#ffd400');
      for (let x = 0; x < w; x += 2) r(x, top - 2, 1, 1, '#a02a2a');
      r(0, top - 5, 2, 3, '#7a1a1a');
      r(w - 2, top - 5, 2, 3, '#7a1a1a');
    } else if (id === 'water') {
      r(0, top - 3, w, 3, '#4a5a70');
      for (let x = 0; x < w; x += 4) r(x, top - 3, 1, 3, '#6a7a90');
    } else {
      if (R() < S.tank) {
        r(5, top - 4, 1, 4, '#2a1a10');
        r(10, top - 4, 1, 4, '#2a1a10');
        r(4, top - 9, 8, 5, '#7a5530');
        r(5, top - 10, 6, 1, '#9a6a3a');
        r(4, top - 6, 8, 1, '#5a3a20');
      } else if (R() < S.ant) {
        const ax = w >> 1;
        r(ax, 0, 1, top, '#8a8fb0');
        r(ax - 2, 5, 5, 1, '#8a8fb0');
        r(ax, 0, 1, 1, '#ff2a4d');
      }
      if (S.bill && R() < S.bill) {          // rooftop billboard
        const ads = ['SALE!', 'NEW!', 'WOW!', 'FUN!', 'TASTY', 'COOL', 'YUM!', 'GO GO'];
        const ad = pick(ads);
        const abg = pick(['#ff4fd8', '#4dc3ff', '#7a3cff', '#ff7a00']);
        r(2, top - 15, w - 4, 12, '#12091f');
        r(3, top - 14, w - 6, 10, abg);
        pxText(r, ad, 3 + ((w - 6 - textW(ad)) >> 1), top - 12, '#ffffff');
        r(6, top - 3, 2, 3, '#555a70');
        r(w - 8, top - 3, 2, 3, '#555a70');
      }
    }

    // ----- WALLS -----
    r(0, top, w, h, base);
    r(0, top, 1, h, light);
    r(w - 2, top, 2, h, dark);
    r(0, top, w, 1, light);
    r(0, top + 1, w, 1, dark);
    if (id === 'estate') {            // make the pale walls look like night time
      g.globalCompositeOperation = 'source-atop';
      g.fillStyle = 'rgba(20,20,70,0.45)';
      g.fillRect(0, 0, w, h + top);
      g.globalCompositeOperation = 'source-over';
    }

    // ----- WINDOWS (some lit, some dark) -----
    const wc = id === 'lantern' ? ['#ffb347', '#ff9a6a', '#ffe98a']
             : (id === 'estate' ? ['#ffe98a', '#ffd27a'] : ['#ffe98a', '#ffb347', '#8ff0ff', '#ff9ad5']);
    const step = id === 'estate' ? 7 : 5;
    for (let y = top + 4; y < top + h - 14; y += step) {
      for (let x = 3; x < w - 4; x += step) {
        r(x, y, 3, 3, R() < S.lit ? pick(wc) : winDark);
      }
    }

    // ----- EXTRAS -----
    if (R() < S.fire) {                       // fire escape
      for (let y = top + 7; y < top + h - 14; y += 10) {
        r(2, y + 3, w - 5, 1, '#07050f');
        for (let i = 0; i < 7; i++) r(3 + i, y + 3 + i, 1, 1, '#07050f');
      }
    }
    if (S.strip) {                            // glowing neon strips down the building
      r(w - 5, top + 6, 1, h - 22, neon);
      r(3, top + 6, 1, h - 22, neon2);
      for (let y = top + 10; y < top + h - 16; y += 14) r(3, y, w - 7, 1, 'rgba(255,255,255,0.18)');
    }
    if (S.lant && w >= 14) {                  // hanging lanterns
      for (let y = top + 8; y < top + h - 22; y += 12) {
        for (const x of [2, w - 6]) {
          r(x, y, 3, 4, '#e0302a');
          r(x, y + 1, 1, 2, '#ff6a50');
          r(x + 1, y - 1, 1, 1, '#ffd400');
          r(x + 1, y + 4, 1, 2, '#ffd400');
        }
      }
      const vw = pick(['TEA', 'BAR', 'WOK', 'SPA', 'INN', 'PUB']);   // little vertical shop sign
      const vx = R() < 0.5 ? 6 : w - 12;
      const vy = top + 5;
      r(vx, vy, 5, 20, '#ffd400');
      r(vx + 1, vy + 1, 3, 18, '#7a1a1a');
      for (let i = 0; i < 3; i++) pxText(r, vw.charAt(i), vx + 1, vy + 2 + i * 6 - (i > 0 ? 0 : 0), '#ffe98a');
    }

    // ----- GROUND FLOOR -----
    if (id === 'estate') {
      r(0, gy, w, 10, '#2a2240');
      for (let x = 3; x < w - 4; x += 6) r(x, gy, 2, 10, '#e8e0f0');
      r((w >> 1) - 2, gy + 3, 4, 7, '#7a3cff');
      r((w >> 1) + 1, gy + 6, 1, 1, '#ffd400');
      r(0, top + h - 3, w, 3, '#1f6a3a');
      for (let x = 0; x < w; x += 3) r(x, top + h - 3, 1, 1, '#2fa05a');
      r((w >> 1) - 3, gy - 1, 6, 1, '#ffd400');
    } else if (id === 'water') {
      r(0, gy, w, 10, '#2a3248');
      r((w >> 1) - 5, gy + 1, 10, 9, '#161c2c');
      for (let i = 0; i < 4; i++) r((w >> 1) - 5, gy + 2 + i * 2, 10, 1, '#242c42');
      r(2, gy + 5, 7, 5, pick(['#ff5a3a', '#3a9bff', '#ffd400']));
      r(w - 10, gy + 5, 7, 5, pick(['#2fbf7a', '#ff5a3a', '#8a5cff']));
      r(1, gy, w - 2, 1, neon);
      const wd = pick(S.words);
      if (textW(wd) + 4 <= w) {
        r((w - textW(wd) - 2) >> 1, gy - 7, textW(wd) + 2, 7, '#0a0614');
        pxText(r, wd, ((w - textW(wd)) >> 1), gy - 6, neon);
      }
    } else {
      r(0, gy, w, 10, '#120a22');
      r(2, gy + 3, w - 4, 6, '#3a2a66');
      r(3, gy + 4, w - 6, 2, 'rgba(255,233,138,0.35)');
      r(1, gy, w - 2, 3, neon);                         // awning
      if (id === 'avenue' && w > 24) r(w >> 1, gy, (w >> 1) - 1, 3, neon2);
      for (let x = 1; x < w - 1; x += 2) r(x, gy, 1, 3, 'rgba(255,255,255,0.35)');
      r((w >> 1) - 1, gy + 4, 3, 6, '#0a0614');         // door
      if (R() < S.sign) {
        const fit = S.words.filter(function (t) { return textW(t) + 4 <= w; });
        if (fit.length > 0) {
          const wd = pick(fit);
          r((w - textW(wd) - 2) >> 1, gy - 7, textW(wd) + 2, 7, '#0a0614');
          pxText(r, wd, ((w - textW(wd)) >> 1), gy - 6, neon2);
        }
      }
    }
  });
  cv.gl = NEON_NAME[neon] || 'warm';       // what colour of light this building gives off
  cv.gb = 8.5;                             // how many sprite-pixels above the ground the light sits
  return cv;
}

function npcSprite(coat, pants, hair, skin, pose, hat) {
  const OY = 5;                                   // 5 spare rows on top so tall hats fit
  const c = makeSprite(10, 16 + OY, function (r) {
    const q = function (x, y, w, h, col) { r(x, y + OY, w, h, col); };
    q(3, 0, 4, 4, hair);                          // head
    if (hat) {
      const H = hat[1], B = hat[2] || H;
      if (hat[0] === 'top') { q(3, -5, 4, 5, H); q(3, -2, 4, 1, B); q(2, -1, 6, 1, H); }              // tall classic top hat (with a band)
      else if (hat[0] === 'fedora') { q(3, -3, 4, 3, H); q(3, -2, 4, 1, B); q(1, -1, 8, 1, H); }       // fedora: dented crown + wide brim
      else if (hat[0] === 'bowler') { q(3, -3, 4, 3, H); q(2, -2, 6, 2, H); q(2, -1, 6, 1, B); }       // round bowler
      else if (hat[0] === 'cap') { q(2, -2, 6, 3, H); q(6, 0, 3, 1, B); }                              // baseball cap with a peak
      else { q(3, -3, 4, 3, H); q(4, -4, 2, 1, B); q(3, 0, 4, 1, H); }                                 // beanie with a bobble
    }
    q(4, 4, 2, 1, skin);
    q(2, 5, 6, 5, coat);
    q(1, 5, 1, 4, coat);
    if (pose === 'phone') {                       // looking at a phone: arm up, bright screen
      q(8, 5, 1, 1, coat); q(8, 3, 1, 3, coat); q(8, 2, 1, 1, skin); q(8, 0, 2, 3, '#bff8ff'); q(9, 1, 1, 1, '#ffffff');
    } else if (pose === 'juice') {                // holding an APPLE JUICE carton up high (same colours as the juice in the game)
      q(8, 5, 1, 2, coat); q(8, 4, 1, 1, skin);
      q(7, 0, 3, 4, '#f2c230'); q(7, -1, 3, 1, '#fff2a0'); q(9, 0, 1, 4, '#c8921a');
      q(7, 1, 2, 2, '#ffffff'); q(7, 2, 1, 1, '#e0344f'); q(8, 1, 1, 1, '#2f9a3a');          // label with a little apple
      q(8, -3, 1, 2, '#ffffff'); q(8, -3, 2, 1, '#e0344f');                                    // bendy straw
    } else if (pose === 'watch') {                // cheering / pointing at the chase
      q(1, 2, 1, 4, coat); q(1, 1, 1, 1, skin); q(8, 2, 1, 4, coat); q(8, 1, 1, 1, skin);
    } else {

    }
    q(2, 10, 2, 5, pants); q(6, 10, 2, 5, pants);
    q(2, 15, 2, 1, '#111'); q(6, 15, 2, 1, '#111');

  c.pose = pose;

  return c;
}

function makeSkyline(seed, w, h, col, winCol, minH, maxH) {
  const R = rng(seed + RUN_SEED);
  return makeSprite(w, h, function (r) {
    let x = 0;
    while (x < w) {
      const bw = 6 + Math.floor(R() * 10);
      const bh = minH + Math.floor(R() * (maxH - minH));
      r(x, h - bh, bw, bh, col);
      const t = R();
      if (t < 0.2) r(x + (bw >> 1), h - bh - 6, 1, 6, col);
      else if (t < 0.4) r(x + 1, h - bh - 2, bw - 2, 2, col);
      for (let wy = h - bh + 3; wy < h - 2; wy += 3) {
        for (let wx = x + 1; wx < x + bw - 1; wx += 3) {
          if (R() < 0.18) r(wx, wy, 1, 1, winCol);
        }
      }
      x += bw + (R() < 0.3 ? 1 : 0);
    }
  });
}

// fictional landmarks seen in the distance
function makeTower(seed, w, h, base, light, dark, win, accent) {
  const R = rng(seed + RUN_SEED);
  return makeSprite(w, h, function (r) {
    const spire = Math.floor(h * 0.16);
    const secs = [[0.5, spire], [0.74, spire + Math.floor(h * 0.12)], [1, spire + Math.floor(h * 0.42)]];
    r((w >> 1), 0, 1, spire, '#aab0d0');
    r((w >> 1), 0, 1, 2, '#ff2a4d');
    for (let i = 0; i < secs.length; i++) {
      const sw = Math.floor(w * secs[i][0]) | 1;
      const sx = (w - sw) >> 1;
      const y0 = secs[i][1];
      const y1 = i + 1 < secs.length ? secs[i + 1][1] : h;
      r(sx, y0, sw, h - y0, base);
      r(sx, y0, 1, h - y0, light);
      r(sx + sw - 1, y0, 1, h - y0, dark);
      r(sx, y0, sw, 1, accent);
    }
    for (let y = spire + 4; y < h - 3; y += 3) {
      for (let x = 2; x < w - 2; x += 3) {
        if (R() < 0.45) r(x, y, 1, 2, win);
      }
    }
    r(0, h - 2, w, 2, dark);
  });
}
